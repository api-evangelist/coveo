          - DOUBLE
          - DATE
          - STRING
          - VECTOR
        includeInQuery:
          type: boolean
          description: Whether this [field](https://docs.coveo.com/en/200/) can be referred to in [Coveo Cloud query syntax](https://docs.coveo.com/en/1552/) expressions (for example, `@myfield=myvalue`).<br /> Coveo Atomic and Headless often rely on the fact that most fields can be referred to in query expressions.Therefore, explicitly setting this option to `false` is not recommended, unless you know for sure that this field is only used to return information on query results.An example where it would make sense to set to `false` would be a field that contains large blobs of data that you want to display in query results, but never want to search on.<br />**Default:** `true`
          example: true
          default: true
        includeInResults:
          type: boolean
          description: Whether the [field](https://docs.coveo.com/en/200/) can be included in the `raw` property of [query](https://docs.coveo.com/en/231/) results.<br />The Search API lets you explicitly specify which fields you want to include in or exclude from the `raw` property of each result at query time.<br />Moreover, the [index](https://docs.coveo.com/en/204/) can include a given field in the `raw` property of a query result only if this field has a non-null value for this particular result.<br /> Therefore, explicitly setting this option to `false` on a field isn't recommended, unless you want to override this behavior and ensure that this field can never be included in the `raw` property of any query result.<br />**Default:** `true`
          example: true
          default: true
        keyValue:
          type: boolean
          description: Whether the field is a [dictionary field](https://docs.coveo.com/en/2036/), which contains mappings of keys to values instead of a single value.<br />**Default:** `false`
          example: false
          default: false
        multilingual:
          type: boolean
          description: Whether the [field](https://docs.coveo.com/en/200/) contains a mapping of languages to values instead of a single value.<br />**Note:** Applicable to field type `STRING` only. This option requires the `keyValue` option to be enabled.<br />**Default:** `false`
          example: false
          default: false
        keepAccentsDisplayValueFacet:
          type: boolean
          description: Whether [field](https://docs.coveo.com/en/200/) values with differing accents should be considered distinct facet values (e.g., `quebec` vs `québec`).<br />**Note:** Applicable to field type `STRING` only.<br />**Default:** `false`
          example: false
          default: false
        keepDistinctDisplayValueFacet:
          type: boolean
          description: Whether [field](https://docs.coveo.com/en/200/) values with differing accents, ligatures, or casing should be considered distinct facet values.<br />This parameter encompasses the behavior of **keepAccentsDisplayValueFacet** but adds differentiation for ligatures (e.g., `ß` vs `ss`) and case sensitivity (e.g., `Québec` vs `québec`).<br />**Note:** Applicable to field type `STRING` only.<br />**Default:** `false`
          example: false
          default: false
        mergeWithLexicon:
          type: boolean
          description: Whether the field is [free text searchable](https://docs.coveo.com/en/1833#free-text-search).<br />**Note:** Applicable to field type `STRING` only.<br />**Default:** `false`
          example: false
          default: false
        smartDateFacet:
          type: boolean
          description: It is heavily recommended to set this option to `false` unless you know for sure you need it.<br /><br />Whether to transform date and time string values into semicolon separated number of days/weeks/months/quarters/years since January 1st, 1900.<br />**Note:** Applicable to [field](https://docs.coveo.com/en/200/) type `DATE` only.<br />If you set this option to `true` on a `DATE` type field, the field itself will be populated by the number of milliseconds since Unix epoch corresponding to the parsed date and time string, as usual.<br />However, the index will also automatically create a new field, and populate it with the smart date data. <br />**Default:** `false`<br /><br />Example:<br />You create the `mydate` field in your [index](https://docs.coveo.com/en/204/) and set the `smartDateFacet` option to `true` on that field. The index processes a source item whose `mydate` metadata value is `2017-11-20T19:58:55.126Z`. The `mydate` metadata is mapped to the `mydate` field in that source.<br />The index populates the `mydate` field with the corresponding number of milliseconds since Unix epoch (that is, `1511207935000`). It also creates a `mydatesmartfacet` field and populates it with the smart date data (that is, `D43057;W6151;M1414;Q471;Y117`).
          example: false
          default: false
        facet:
          type: boolean
          description: Whether [Group By](https://docs.coveo.com/en/203/) operations and [Facet](https://docs.coveo.com/en/198/) requests can be performed on the [field](https://docs.coveo.com/en/200/).<br />This option can't be set to `false` on a non-`STRING` type field.<br />**Default:**<br /> - `false` for `STRING` type fields.<br /> - `true` for all other types of fields.
          example: false
        multiValueFacet:
          type: boolean
          description: Whether the [field](https://docs.coveo.com/en/200/) contains multiple values (see also the `multiValueFacetTokenizers` property).<br />**Note:** Applicable to field type `STRING` only.<br />**Default:** `false`
          example: false
          default: false
        hierarchicalFacet:
          type: boolean
          description: Whether the [field](https://docs.coveo.com/en/200/) contains multiple values that form a hierarchy (see also the `multiValueFacetTokenizers` property).<br />**Note:** Applicable to field type `STRING` only.<br />**Default:** `false`
          example: false
          default: false
        sort:
          type: boolean
          description: Whether [query](https://docs.coveo.com/en/231/) results can be sorted based on the value of the [field](https://docs.coveo.com/en/200/).Having lots of sortable `STRING` type fields in a Coveo organization can have an adverse effect on its [index](https://docs.coveo.com/en/204/) size and performance.<br />This option can't be set to `false` on a non-`STRING` type field.<br />**Default:**<br /> - `false` for `STRING` type fields.<br /> - `true` for all other types of fields.
          example: false
        ranking:
          type: boolean
          description: Whether to use the [field](https://docs.coveo.com/en/200/) in result ranking calculation only.<br />**Notes:** <br /> - Has a significant impact on query performance.<br /> - Applicable to field type `STRING`<br /><br /> **Default:** `false`
          example: false
          default: false
        stemming:
          type: boolean
          description: Whether to allow [stemming](https://docs.coveo.com/en/1576/) on [field](https://docs.coveo.com/en/200/) [queries](https://docs.coveo.com/en/231/).<br />**Notes:** <br /> - applicable to `STRING` type fields only. <br /> - Has a significant impact on query performance. <br /><br />**Default:** `false`
          example: false
          default: false
        multiValueFacetTokenizers:
          type: string
          description: The character to use as a value separator, if the [field](https://docs.coveo.com/en/200/) contains multiple values (see also the `multiValueFacet` property). <br />**Example:** `;`
          example: ;
        useCacheForNestedQuery:
          type: boolean
          description: Whether to keep the data required to perform [nested queries](https://docs.coveo.com/en/220) in memory. Setting this option to `true` on a [field](https://docs.coveo.com/en/200/) also speeds query performance for expressions that compare the value of this field using [regex, wildcard, phonetic match, or fuzzy match query operators](https://docs.coveo.com/en/1552).<br />**Note:** only applicable to fields which are faceted or multi-value faceted.<br />**Default:** `false`
          example: false
          default: false
        useCacheForSort:
          type: boolean
          description: Whether to keep the entire [field](https://docs.coveo.com/en/200/) in memory for fast sorting.<br />**Default:** `false`<br />This option can't be set to true on a `STRING` type field, unless the `sort` option is also `true` for that field.
          example: false
          default: false
        useCacheForNumericQuery:
          type: boolean
          description: Whether to keep the data required to execute operations on numeric and date [fields](https://docs.coveo.com/en/200/) in memory.<br />**Note:** Cannot be enabled on `STRING` type fields.<br />**Default:** `false`
          example: false
          default: false
        useCacheForComputedFacet:
          type: boolean
          description: Whether to keep computed field data in memory.<br />**Note:** Cannot be enabled on `STRING` type fields.<br />**Default:** `false`
          example: false
          default: false
        dateFormat:
          type: string
          description: A regex indicating the date format, for some `date` type fields.<br />**Example:** `%Y/%m/%d@%H:%M:%S%G`
          example: '%Y/%m/%d@%H:%M:%S%G'
        system:
          type: boolean
          description: Whether the [field](https://docs.coveo.com/en/200/) is a standard Coveo field.<br />**Note:** `system` option can not be set to `true`.<br />**Default:** `false`
          example: false
        projectIds:
          type: array
          description: List of Project IDs a [field](https://docs.coveo.com/en/200/) can be associated with.<br />**Note:** This is an optional list of `STRING`<br />**Default:** `null`
          items:
            type: string
            description: List of Project IDs a [field](https://docs.coveo.com/en/200/) can be associated with.<br />**Note:** This is an optional list of `STRING`<br />**Default:** `null`
        mappings:
          type: array
          items:
            $ref: '#/components/schemas/FieldMappingModel'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/LightSourceModel'
      description: A [field](https://docs.coveo.com/en/200/).
