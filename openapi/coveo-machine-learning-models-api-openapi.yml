              schema:
                $ref: '#/components/schemas/Model_With_Additional_Information'
      x-pretty-name: getModelDetailsById
      x-required-privilege:
        owner: COVEO_ML
        targetDomain: MODELS
        type: VIEW
        targetId: '*'
      x-required-privileges:
      - owner: COVEO_ML
        targetDomain: MODELS
        type: VIEW
        targetId: '*'
      x-ui-operation-id: /rest/organizations/paramId/machinelearning/models/paramId/details_get
  /rest/organizations/{organizationId}/machinelearning/models/details:
    get:
      tags:
      - Machine Learning Models
      summary: Get Detailed Information About All Models
      description: '<details><summary>Privilege required</summary>

        ```

        {"owner":"COVEO_ML","targetDomain":"MODELS","type":"VIEW","targetId":"*"}

        ```

        </details>'
      operationId: listModelsWithDetails
      parameters:
      - name: organizationId
        in: path
        description: The unique identifier of the target Coveo Cloud organization
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                uniqueItems: true
                type: array
                items:
                  $ref: '#/components/schemas/Model_With_Additional_Information'
      x-pretty-name: listModelsWithDetails
      x-required-privilege:
        owner: COVEO_ML
        targetDomain: MODELS
        type: VIEW
        targetId: '*'
      x-required-privileges:
      - owner: COVEO_ML
        targetDomain: MODELS
        type: VIEW
        targetId: '*'
      x-ui-operation-id: /rest/organizations/paramId/machinelearning/models/details_get
  /rest/organizations/{organizationId}/machinelearning/engines/{engineId}/models/{modelName}:
    delete:
      tags:
      - Machine Learning Models
      summary: Delete a Model
      description: '<details><summary>Privilege required</summary>

        ```

        {"owner":"COVEO_ML","targetDomain":"MODELS","type":"EDIT","targetId":"*"}

        ```

        </details>'
      operationId: unregister
      parameters:
      - name: organizationId
        in: path
        description: The unique identifier of the target Coveo Cloud organization
        required: true
        schema:
          type: string
      - name: engineId
        in: path
        description: The id of the engine
        required: true
        schema:
          type: string
      - name: modelName
        in: path
        description: The model name
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
      deprecated: true
      x-pretty-name: unregister
      x-required-privilege:
        owner: COVEO_ML
        targetDomain: MODELS
        type: EDIT
        targetId: '*'
      x-required-privileges:
      - owner: COVEO_ML
        targetDomain: MODELS
        type: EDIT
        targetId: '*'
      x-ui-operation-id: /rest/organizations/paramId/machinelearning/engines/paramId/models/paramId_delete
components:
  schemas:
    Registration_Response:
      required:
      - engineId
      - exportPeriod
      - intervalTime
      - intervalUnit
      type: object
      properties:
        commandLineParameters:
          type: array
          description: 'DEPRECATED: no longer supported as of Dec 2023'
          readOnly: true
          deprecated: true
          items:
            type: string
            description: 'DEPRECATED: no longer supported as of Dec 2023'
            readOnly: true
            deprecated: true
        commonFilter:
          type: string
          description: The filter to apply to the common event dimensions (shared by all event types) in the export. Multiple filter parameters are joined with the AND operator
          example: country=='United States'
        customEventFilter:
          type: string
          description: The filter to apply to the custom event dimensions in the export. Multiple filter parameters are joined with the AND operator
          example: (customEventValue=='submitButton') AND (customEventType=='caseCreation')
        viewEventFilter:
          type: string
          description: The filter to apply to the view event dimensions (shared by all event types) in the export. Multiple filter parameters are joined with the AND operator
          example: viewContentType=@'product'
        engineId:
          type: string
          description: The id of the engine
          example: topclicks
        exportOffset:
          type: string
          description: The offset period to apply to the export. An undefined `exportOffset` means that the `exportPeriod` is based on the moment when the model was generated. An `exportOffset` of `P1W` means that the `exportPeriod` is based on the moment one week before the model was generated. If specified, must be in the ISO8601 period format (i.e., `PyYmMwWdDThHmMsS`)
          example: P1W
          deprecated: true
        exportPeriod:
          type: string
          description: The period to export data from. Unless an `exportOffset` is specified, the `exportPeriod` uses the moment when the model was generated as a base. Must be in the ISO8601 period format (i.e., `PyYmMwWdDThHmMsS`)
          example: P1D
        intervalTime:
          type: integer
          description: The number of `intervalUnit` between each run of the job, should be greater than or equal to 1
          format: int32
          example: 1
        extraConfig:
          type: object
          description: A JSON object representing the additional configuration to pass to a model configuration
          example:
            someKey: value
        intervalUnit:
          type: string
          description: The duration unit of the interval between each run of the job. See `intervalTime`
          example: WEEK
          enum:
          - DAY
          - WEEK
          - MONTH
        modelDisplayName:
          type: string
          description: The model display name in the Coveo Cloud V2 administration console
          example: MyModelDisplayName
        modelName:
          type: string
          description: The model name
          example: remove_me_model_name
        searchEventFilter:
          type: string
          description: The filter to apply to the click and search event dimensions in the export. Multiple filter parameters are joined with the AND operator
          example: (originLevel1=~'search' OR originLevel1=~'listings')
        startTime:
          type: string
          description: A timestamp indicating when to begin the first job (in milliseconds since UNIX epoch format). If no start date is specified, the job starts immediately
          format: date-time
          readOnly: true
          deprecated: true
        versionMatcher:
          $ref: '#/components/schemas/VersionExpression'
        groupsThatCanEdit:
          uniqueItems: true
          type: array
          description: 'DEPRECATED: not supported as of Jan 2026'
          readOnly: true
          deprecated: true
          items:
            $ref: '#/components/schemas/IdAndDisplayNameModel'
        apiKeysThatCanEdit:
          uniqueItems: true
          type: array
          description: 'DEPRECATED: not supported as of Jan 2026'
          readOnly: true
          deprecated: true
          items:
            $ref: '#/components/schemas/IdAndDisplayNameModel'
        modelId:
          type: string
          description: The unique identifier of the target model
          example: My_Model_ID
        endTime:
          type: string
          description: The epoch date when the schedule will end. If there is no end date, the schedule will last forever.
          format: date-time
          readOnly: true
          deprecated: true
        platformVersion:
          type: integer
          format: int32
          deprecated: true
          enum:
          - 1
          - 2
        orgId:
          type: string
          description: The unique identifier of the target Coveo Cloud organization
          example: MyCoveoOrganization
        resourceId:
          type: string
          deprecated: true
    RegistrationId:
      type: object
      properties:
        modelId:
          type: string
    IdAndDisplayNameModel:
      type: object
      properties:
        id:
          type: string
        displayName:
          type: string
      description: 'DEPRECATED: not supported as of Jan 2026'
      readOnly: true
      deprecated: true
    ModelErrorDescription:
      type: object
      properties:
        customer_errors:
          type: array
          items:
