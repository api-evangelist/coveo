          - author
          - date
          - filetype
          - language
          - conversationid
          - messageid
          - childid
          - adjustednumberoflikes
          items:
            type: string
        enableDidYouMean:
          type: boolean
          description: '<p><strong>Important:</strong> This feature is still in an experimental state.</p><p>Whether to enable the Coveo ML query suggestions <i>Did You Mean</i> feature, which populates the <code>queryCorrection</code> property of a successful response with keyword correction suggestions.</p><p>Notes: <ul><li>The Coveo ML query suggestions Did You Mean feature only processes the basic query expression (see the <code>q</code> parameter).</li><li>When both the <code>enableDidYouMean</code> and <code>enableMLDidYouMean</code> parameters are set to <code>true</code>, the output of both features will appear in the <code>queryCorrections</code> array.</li></ul></p>'
          default: false
        sortCriteria:
          type: string
          description: '<p>The criteria to use for sorting the query results.</p> <p>Allowed values: <ul> <li><code>relevancy</code>: use standard index ranking factors (adjacency, TDIDF, etc.) and custom ranking expressions (QREs and QRFs) to compute a ranking <code>score</code> for each query result item, and sort the query results by descending <code>score</code> value.</li> <li><code>date ascending</code>/<code>date descending</code>: use the <code>@date</code> field to sort the query results. This field typically contains the last modification date of each item.</li> <li><code>qre</code>: use only custom ranking expressions (QREs and QRFs) to compute a ranking <code>score</code> for each query result item, and sort the query results by descending <code>score</code> value.</li> <li><code>nosort</code>: do not sort the query results; the index will return result items in an essentially random order.</li> <li><code>@[field] ascending</code>/<code>@[field] descending</code>: sort using the value of a specific sortable field (replace <code>[field]</code> with the name of the target field).</li> </ul> </p> <p> You can specify a list of comma-separated sort criteria. However, this only works when combining: <ul> <li>two or more field criteria (e.g., <code>@views descending,@likes descending</code>).</li> <li>a single date criteria with one or mode field criteria (e.g., <code>date ascending,@views descending</code>).</li> </ul> </p> <p> Examples: <ul> <li><code>date ascending</code></li> <li><code>@author ascending</code></li> <li><code>date descending,@views descending,@likes descending</code></li> </ul> </p>'
          default: relevancy
        tab:
          type: string
          description: <p>The second level of origin of the request, typically the identifier of the selected tab in the graphical search interface from which the request originates.</p> <p>Coveo Machine Learning models use this information to provide contextually relevant output.</p> <p><strong>Note:</strong> When logging a <strong>Search</strong> usage analytics event for a query, the <code>originLevel2</code> field of that event should be set to the <code>tab</code> value of the query (or to the <code>&quot;default&quot;</code> string, if no <code>tab</code> value was specified in the query).</p>
