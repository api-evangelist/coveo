              label:
                type: string
                description: The title of the facet.
              displayValuesAs:
                type: string
                description: Whether to display the facet values as checkboxes (multiple selection), links (single selection), or boxes (multiple selection). Possible values are <code>checkbox</code>, <code>link</code>, and <code>box</code>.
                example: link
                default: checkbox
        tabs:
          type: array
