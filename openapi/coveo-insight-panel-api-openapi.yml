        numberOfResults:
          type: integer
          description: <p>The number of results to return.</p><p>Along with the <code>firstResult</code> parameter, this allows you to retrieve a specific page of result items.</p><p>This parameter also defines the maximum number of results which can be returned by the Coveo ML Recommencations feature.</p><p><strong>Note:</strong> The maximum <code>numberOfResults</code> value depends on the index settings of your Coveo organization. By default, a Coveo index can return a maximum of 5,000 items per query.</p>
        caseContext:
          type: object
