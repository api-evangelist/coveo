    RestHierarchicalFacetResponseValue:
      type: object
      properties:
        field:
          type: string
          description: The name of the field on which the facet is based.
          example: author
        moreValuesAvailable:
          type: boolean
          description: Whether additional values are available for the facet.
        values:
          type: array
          description: The returned facet values.
          items:
            type: object
            properties:
              value:
                type: string
                description: <p>The name of the facet value.</p><p><strong>Note:</strong> In the case of a hierarchical facet value, this represents a single path segment.</p>
                example: Alice Smith
              state:
                type: string
                description: The current state of the facet value in the search interface.
                default: idle
                enum:
                - idle
                - selected
                - excluded
              numberOfResults:
                type: integer
                description: <p>The number of query results that can be expected if the facet value is selected in the search interface.</p><p><strong>Note:</strong> This property only gets populated when the facet currently has no selected or excluded values.</p>
              endInclusive:
                type: boolean
                description: Whether to include the <code>end</code> value in the range.
                default: false
              children:
                type: array
                description: <p>The children of this hierarchical facet value.</p> <p>Each child is a full-fledged hierarchical facet value that may in turn have its own children and so forth, up to a maximum depth of 50 levels.</p>
                items:
                  $ref: '#/components/schemas/RestHierarchicalFacetResponseValue'
              moreValuesAvailable:
                type: boolean
                description: Whether additional values are available for the facet.
              isSuggested:
                type: boolean
              isAutoSelected:
                type: boolean
                description: Whether the facet value was automatically selected by Coveo ML.
              path:
                type: array
                items:
                  type: string
              isLeafValue:
                type: boolean
                description: Whether the hierarchical value is a childless node.
        mlScore:
          type: number
          description: The ranking score computed by Coveo ML DNE for this facet.
        indexScore:
          type: number
          description: The ranking score computed by the index for this facet.
        isFromAutoSelect:
          type: boolean
          description: Whether the facet was recommended by Coveo ML.
    RestDebug:
      type: boolean
      description: '<p>Whether to force a successful response to include debug information.</p> <p> Notes: <ul> <li>Debug information can only appear in responses in the JSON format (see the <code>format</code> parameter).</li> <li>Avoid setting this parameter to <code>true</code> in production, as it has a negative impact on query performance.</li> </ul> </p>'
      default: false
    RestHighlightResponse:
      type: object
      properties:
        length:
          type: integer
          description: The length of the word (in number of characters) to highlight.
          example: 5
        offset:
          type: integer
          description: The 0-based index position of the first character of the word to highlight in the string.
          example: 15
    RestInsightPanelQuerySuggestResponse:
      type: object
      properties:
        completions:
          type: array
          items:
            type: object
            properties:
              expression:
                type: string
              score:
                type: number
              highlighted:
                type: string
              executableConfidence:
                type: number
              objectId:
                type: string
        responseId:
          type: string
        executionReport:
          type: object
          properties: {}
          description: The execution report that is produced when the <code>debug</code> parameter is set to <code>true</code>.
    RestConditions:
      type: array
      items:
        type: object
    RestInsightPanelSearchResponse:
      type: object
      properties:
        totalCount:
          type: integer
          description: <p>The total number of items that match the query for the current user (security trimming applied).</p> <p><strong>Note:</strong> When logging a Search Usage Analytics event for a query, the <code>numberOfResults</code> field of that event should be set to the <code>totalCount</code> value of the query (for reporting purposes).</p>
          example: 250
        totalCountFiltered:
          type: integer
          description: <p>The total number of items that match the query for the current user (security trimming applied) after duplicate filtering has been applied (see the <code>duplicateFiltering</code> query parameter).</p>
          example: 245
        duration:
          type: integer
          description: <p>The <code>requestDuration</code> added to the computing time (in milliseconds) that was required by the Search API.</p>
          example: 1235
        indexDuration:
          type: object
          description: <p>The time (in milliseconds) that was required for the index to find the query items.</p>
          example: '1175'
        requestDuration:
          type: integer
          description: <p>The <code>indexDuration</code> added to the time (in milliseconds) that was required to establish a connection between the Search API server and the index server.</p>
          example: 1181
        searchUid:
          type: string
          description: <p>The query <a href="https://en.wikipedia.org/wiki/Universally_unique_identifier">UUID</a>. Each query sent to the Search API has its own randomly generated <code>searchUid</code>.</p> <p><strong>Note:</strong> When logging a Search or Custom Usage Analytics event for a query, or a Click Usage Analytics event for an opened query result item, the <code>searchQueryUid</code> field of that event should be set to the <code>searchUid</code> value of the query response.</p>
          example: a0e4773c-39c3-423c-90cd-c03a640ecde5
        pipeline:
          type: string
          description: <p>The name of the query pipeline to use for this request (bypassing its conditions, if it has any).</p>
          example: CustomQueryPipeline
        apiVersion:
          type: integer
          description: <p>The version of the Search API that sent the query.</p>
          example: 2
        exception:
          type: object
          properties:
            code:
              type: string
            context:
              type: string
        isFallbackToAdmin:
          type: boolean
          description: <p>Whether the admin session ID was allowed and used by the Coveo for Salesforce search engine. The value will be set to <code>true</code> when this is the case, and might be absent or set to <code>false</code> otherwise.</p>
        warnings:
          type: array
          description: <p>The errors that did not make the query fail, but should be addressed. These might be security issues, deprecated behaviors, or any other kind of concern.</p>
          items:
            type: string
        errors:
          type: array
          description: <p>The errors that critically changed the query behavior. These should be addressed right away to prevent future errors.</p>
          items:
            type: string
        index:
          type: string
          description: <p>The identifier of the index mirror against which the query was executed (see the <code>indexToken</code> query parameter).</p>
          example: mycoveocloudv2organizationid-cqjd206sta1xb9qyxfhhnsu294-Indexer-2-9rbfxhp1n07cth80ckzeh3zotc
        indexToken:
          type: string
          description: <p>The Base64 encoded identifier of the index mirror to which the request was forwarded (see the <code>index</code> parameter).</p> <p>If you do not specify an <code>indexToken</code> (or <code>index</code>) value, any index mirror could be used.</p> <p><strong>Note:</strong> Passing an <code>indexToken</code> (or <code>index</code>) value has no effect when the results of a specific request can be returned from cache (see the <code>maximumAge</code> query parameter).</p>
          example: ZXhhbXBsZWluZGV4bWlycm9yLS4uLg==
        triggers:
          type: object
          properties:
            type:
              type: string
              description: <p>The type of Coveo query pipeline Trigger statement (see <a href="https://docs.coveo.com/en/3413">Manage trigger rules</a>).</p>
              example: notify
            content:
              type: object
              properties: {}
          description: <p>The actions that the client should perform based on the Trigger statements defined in the query pipelines (see the <code>pipeline</code> query parameter).</p> <p><strong>Note:</strong> A trigger statement must have a condition. Otherwise, the Search API ignores it and does not include it in the <code>triggers</code> array of the query response (see <a href="https://docs.coveo.com/en/3413">Manage trigger rules</a>).</p>
        termsToHighlight:
          type: object
          properties: {}
          description: <p>The terms to highlight in each query result item. Includes all basic query expression keywords, as well as any word that was stemmed from a basic query expression keyword (see the <code>q</code> query parameter), unless the keyword was preceded by the no stemming Coveo query syntax operator (<code>+</code>).</p>
          example:
            coveo: []
            cloud:
            - clouds
            v2: []
            platform:
            - platforms
        phrasesToHighlight:
          type: object
          properties: {}
          description: <p>The phrases to highlight in each query result item. This property is populated when the basic query expression (see the <code>q</code> query parameter) contains one or more exact phrase match requests (terms between double quote characters).</p>
          example:
            cloud v2:
              cloud: []
              v2: []
        queryCorrections:
          type: object
          properties:
            correctedQuery:
              type: string
              description: The corrected query expression.
              example: Coveo Cloud V2 platform
            wordCorrections:
              type: array
              description: The word correction suggestions.
              items:
                type: object
                properties:
                  offset:
                    type: integer
                    description: The offset (in number of characters) of the corrected word, from the beginning of the corrected query expression.
                    example: 15
                  length:
                    type: integer
                    description: The length (in number of characters) of the corrected word.
                    example: 8
                  originalWord:
                    type: string
                    description: The original, un-corrected word.
                    example: platfomr
                  correctedWord:
                    type: string
                    description: The suggested word correction.
                    example: platform
          description: <p>The query corrections suggested by the index, if the <code>enableDidYouMean</code> query parameter was set to <code>true</code>.</p>
        refinedKeywords:
          type: array
          description: The refined keywords used by the Coveo ML Automatic Relevance Tuning (ART) model.
          example:
          - v2
          - platform
          - cloud
          - coveo
          items:
            type: string
        categoryFacets:
          type: array
          description: Hierarchical data results that correspond to the hierarchical data in the query.
          items:
            type: object
            properties:
              field:
                type: string
              values:
                type: array
                items:
                  type: object
                  properties:
                    value:
                      type: string
                    numberOfResults:
                      type: integer
              parentValues:
                type: array
                items:
                  type: object
                  properties:
                    value:
                      type: string
                    numberOfResults:
                      type: integer
        facets:
          type: array
          description: <p>The facet results returned by the query. These results are included in the order they were requested in the <code>facets</code> query parameter.</p>
          items:
            $ref: '#/components/schemas/RestHierarchicalFacetResponseValue'
        suggestedFacets:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                description: The name of the field on which the DNE facet suggestion is based.
                example: author
              values:
                type: array
                description: The suggested facet values.
                items:
                  type: object
                  properties:
                    value:
                      type: string
                      description: A DNE facet value suggestion.
                      example: Alice Smith
                    path:
                      type: array
                      description: '<p>The path to the suggested facet value (only applies to hierarchical facet value suggestions).</p> <p>Example: If the suggested hierarchical facet value is <code>Parrot</code>, the returned path could be <code>["Animals", "Birds", "Parrot"]</code>.</p>'
