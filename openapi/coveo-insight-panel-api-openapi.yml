            subject: This is the case subject
            description: This is the case description
        fieldsToInclude:
          type: array
          description: <p>The names of the fields to include with each item in the query results. If specified, no other fields will be included.</p><p><strong>Note:</strong> If you specify both an array of fields to include and an array of fields to exclude (see the <code>fieldsToExclude</code> parameter), the <code>fieldsToExclude</code> parameter has no effect at all.</p> <p>If you do not explicitly specify an array of values for this parameter (or for the <code>fieldsToExclude</code> parameter), each query result item will include all of its available fields.</p>
          example:
