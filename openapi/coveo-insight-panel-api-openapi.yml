                example: People
              conditions:
                $ref: '#/components/schemas/RestConditions'
        settings:
          type: object
          properties:
            createArticle:
              type: object
              properties:
                enabled:
                  type: boolean
            fullSearch:
              type: object
              properties:
                enabled:
                  type: boolean
          description: The settings for the Insight Panel interface.
