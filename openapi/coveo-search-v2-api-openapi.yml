        maximumAge:
          $ref: '#/components/schemas/MaximumAge'
        searchHub:
          $ref: '#/components/schemas/SearchHub'
        tab:
          $ref: '#/components/schemas/Tab'
        referrer:
          $ref: '#/components/schemas/Referrer'
        context:
          $ref: '#/components/schemas/Context'
        actionsHistory:
          $ref: '#/components/schemas/ActionsHistory'
        recommendation:
          $ref: '#/components/schemas/Recommendation'
        locale:
          $ref: '#/components/schemas/Locale'
        timezone:
          $ref: '#/components/schemas/Timezone'
        format:
          $ref: '#/components/schemas/Format'
        debug:
          $ref: '#/components/schemas/Debug'
        indexToken:
          $ref: '#/components/schemas/IndexToken'
        visitorId:
          $ref: '#/components/schemas/VisitorId'
        language:
          $ref: '#/components/schemas/Language'
        mlParameters:
          $ref: '#/components/schemas/MlParameters'
        pipelineRuleParameters:
          $ref: '#/components/schemas/PipelineRuleParameters'
        indexType:
          $ref: '#/components/schemas/IndexType'
        index:
          $ref: '#/components/schemas/Index'
        logicalIndex:
          $ref: '#/components/schemas/LogicalIndex'
        maximumTimeoutMs:
          $ref: '#/components/schemas/MaximumTimeoutMs'
        analytics:
          $ref: '#/components/schemas/AnalyticsRequestParameters'
        commerce:
          $ref: '#/components/schemas/RestCommerceParameters'
    RestFacetSearchResponse:
      required:
      - moreValuesAvailable
      - values
      type: object
      properties:
        values:
          type: array
          description: The returned facet values.
          items:
            $ref: '#/components/schemas/RestFacetSearchResultValue'
        moreValuesAvailable:
          type: boolean
          description: Whether additional facet values matching the request are available.
    PreprocessingOutput:
      required:
      - triggers
      type: object
      properties:
        triggers:
          type: array
          description: The query response output generated by _trigger_ rules in the query pipeline (i.e., by `execute`, `notify`, `query`, and `redirect` rules).
          items:
            type: object
            additionalProperties: {}
    RestFacetSearchParameters:
      oneOf:
      - $ref: '#/components/schemas/RestFacetSearchParametersSpecific'
      - $ref: '#/components/schemas/RestFacetSearchParametersHierarchical'
      discriminator:
        propertyName: type
        mapping:
          specific: '#/components/schemas/RestFacetSearchParametersSpecific'
          hierarchical: '#/components/schemas/RestFacetSearchParametersHierarchical'
    RestFacetRequestSpecificSortCriteriaExplicit:
      oneOf:
      - $ref: '#/components/schemas/RestFacetRequestSpecificSortCriteriaExplicitScore'
      - $ref: '#/components/schemas/RestFacetRequestSpecificSortCriteriaExplicitCustomSort'
      - $ref: '#/components/schemas/RestFacetRequestSpecificSortCriteriaExplicitAlphanumeric'
      - $ref: '#/components/schemas/RestFacetRequestSpecificSortCriteriaExplicitAlphanumericNatural'
      - $ref: '#/components/schemas/RestFacetRequestSpecificSortCriteriaExplicitOccurences'
      discriminator:
        propertyName: type
        mapping:
          score: '#/components/schemas/RestFacetRequestSpecificSortCriteriaExplicitScore'
          custom: '#/components/schemas/RestFacetRequestSpecificSortCriteriaExplicitCustomSort'
          alphanumeric: '#/components/schemas/RestFacetRequestSpecificSortCriteriaExplicitAlphanumeric'
          alphanumericNatural: '#/components/schemas/RestFacetRequestSpecificSortCriteriaExplicitAlphanumericNatural'
          occurences: '#/components/schemas/RestFacetRequestSpecificSortCriteriaExplicitOccurences'
    RestFacetRequestBase:
      type: object
      required:
      - field
      properties:
        field:
          type: string
          description: 'The name of the field on which to base the facet request.


            **Note:** Must reference a field whose **Facet** option is enabled (see [Manage fields](https://docs.coveo.com/en/1833/)).'
          example: author
        facetId:
          type: string
          description: 'The unique identifier of the facet in the search interface.


            **Note:** Must match `^[A-Za-z0-9-_]{1,60}$.'
          example: author-1
        type:
          type: string
          description: 'The kind of values to request for the facet.


            **Allowed values:**

            - `specific`: Request facet values representing specific values (e.g., Alice Smith, Bob Jones, etc.).

            - `dateRange`: Request facet values representing ranges of dates (e.g., 2019-07-01..2019-07-31, 2019-08-01..2019-08-01, etc.).

            - `numericalRange`: Request facet values representing ranges of numbers (e.g., 0..10, 11..20, etc.).

            - `hierarchical`: Request facet values representing hierarchically structured categories (e.g., Electronics > Entertainment > Gaming Consoles;, Electronics > Computers > Laptops, etc.).'
          enum:
          - specific
          - dateRange
          - numericalRange
          - hierarchical
          default: specific
        filterFacetCount:
          type: boolean
          description: 'Whether to exclude folded result parents when estimating the result count for each facet value.


            **Note:** The target folding field must be a facet field with the **Use cache for nested queries** options enabled (see [Manage fields](https://docs.coveo.com/en/1833/)).'
          default: true
        injectionDepth:
          type: integer
          description: 'The maximum number of items to scan for facet values.


            **Note:** A high `injectionDepth` may negatively impact the facet request performance.'
          format: int32
          default: 1000
        isFieldExpanded:
          type: boolean
          description: Whether to make this facet request in the context of requesting more facet values. In most cases, to request more facet values, set `isFieldExpanded` to `true` and increase `numberOfResults`.
          default: false
        preventAutoSelect:
          type: boolean
          description: Whether to prevent Coveo ML from automatically selecting values.
          default: false
        resultsMustMatch:
          type: string
          enum:
          - atLeastOneValue
          - allValues
          description: 'Specifies how a result must match the selected values.


            **Allowed values:**

            - `atLeastOneValue`: A result will match if at least **one** of the corresponding facet values is selected.

            - `allValues`: A result will match if **all** corresponding facet values are selected.


            **Default:** `atLeastOneValue`'
          default: atLeastOneValue
    RestFacetValueHierarchical:
      allOf:
      - $ref: '#/components/schemas/RestFacetValueBase'
      - $ref: '#/components/schemas/RestFacetValueHierarchicalBase'
    RestFacetRequestDateRange:
      allOf:
      - $ref: '#/components/schemas/RestFacetRequestBase'
      - $ref: '#/components/schemas/RestFacetRequestRangeBase'
      - $ref: '#/components/schemas/RestFacetRequestDateRangeBase'
    RestQueryResponse:
      required:
      - apiVersion
      - categoryFacets
      - duration
      - facets
      - groupByResults
      - index
      - indexDuration
      - phrasesToHighlight
      - pipeline
      - refinedKeywords
      - requestDuration
      - results
      - searchUid
      - suggestedFacets
      - termsToHighlight
      - totalCount
      - totalCountFiltered
      - triggers
      type: object
      properties:
        totalCount:
          type: integer
          description: "The total number of items matching the query for the current user (security trimming applied).  \n  \n**Note:** When logging a **Search** usage analytics event for a query, the `numberOfResults` field of that event should be set to the `totalCount` value of the query (for reporting purposes)."
          format: int32
          example: 250
        totalCountFiltered:
          type: integer
          description: The total number of items matching the query for the current user (security trimming applied) after duplicate filtering has been applied (see the `duplicateFiltering` query parameter).
          format: int32
          example: 245
        duration:
          type: integer
          description: The `requestDuration` added to the computing time (in milliseconds) that was required by the Search API.
          format: int32
          example: 1235
        indexDuration:
          type: integer
          description: The time (in milliseconds) that was required by the index to find the query items.
          format: int32
          example: 1175
        requestDuration:
          type: integer
          description: The `indexDuration` added to the time (in milliseconds) that was required to establish a connection between the Search API server and the index server.
          format: int32
          example: 1181
        searchUid:
          type: string
          description: "The query [UUID](https://en.wikipedia.org/wiki/Universally_unique_identifier). Each query sent to the Search API has its own randomly generated `searchUid`.  \n  \n**Note:** When logging a **Search** or **Custom** usage analytics event for a query, or a **Click** usage analytics event for an opened query result item, the `searchQueryUid` field of that event should be set to the `searchUid` value of the query response."
          example: a0e4773c-39c3-423c-90cd-c03a640ecde5
        pipeline:
          $ref: '#/components/schemas/Pipeline'
        apiVersion:
          type: integer
          description: The version of the Search API that sent the query.
          format: int32
          example: 2
        splitTestRun:
          type: string
          description: The name of the active A/B test for the query pipeline. This field appears only when an A/B test is active. Use it to identify the test associated with the query.
          example: CustomerQueryPipeline-mirror-1725560351
        exception:
          $ref: '#/components/schemas/RestException'
        isFallbackToAdmin:
          type: boolean
          description: Whether the admin session ID was allowed and used by the Coveo for Salesforce search engine. The value will be set to `true` when it is the case, and might be absent or set to `false` otherwise.
        warnings:
          type: array
          description: The errors that did not make the query fail, but should be addressed. They might be security issues, deprecated behaviors, or any other kind of concern.
          items:
            type: string
        errors:
          type: array
          description: The errors that critically changed the query behaviour. These should be addressed right away to prevent future errors.
          items:
            type: string
        index:
          type: string
          description: The identifier of the index mirror against which the query was executed (see the `indexToken` query parameter).
          example: mycoveocloudv2organizationid-cqjd206sta1xb9qyxfhhnsu294-Indexer-2-9rbfxhp1n07cth80ckzeh3zotc
        indexToken:
          $ref: '#/components/schemas/IndexToken'
        triggers:
          type: array
          description: 'The actions to perform by the client based on the Trigger statements defined in query pipelines (see the `pipeline` query parameter).


            **Note:**

            > A Trigger statement must have a condition. Otherwise, the Search API ignores it and does not include it in the `triggers` array of the query response (see [Manage trigger rules](https://docs.coveo.com/en/3413/)).'
          items:
            $ref: '#/components/schemas/RestTriggerResponse'
        termsToHighlight:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: The terms to highlight in each query result item. Includes all basic query expression keywords, as well as any word stemmed from a basic query expression keyword (see the `q` query parameter), unless this keyword was preceded by the no stemming Coveo Cloud query syntax operator (`+`).
          example:
            coveo: []
            cloud:
            - clouds
            v2: []
            platform:
            - platforms
        phrasesToHighlight:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: array
              items:
                type: string
          description: The phrases to highlight in each query result item. This property is populated when the basic query expression (see the `q` query parameter) contains one or several exact phrase match requests (terms between double quote characters).
          example:
            cloud v2:
              cloud: []
              v2: []
        queryCorrection:
          type: object
          description: 'Property returned when the `queryCorrection` feature is enabled.


            It will either return:


            - The `originalQuery` and `correctedQuery` if the query was automatically corrected.

            - A list of `corrections` that could be be manually applied afterward.

            '
          properties:
            originalQuery:
              type: string
              description: 'If the query was automatically corrected, this property indicates the original basic query expression (`q`) that triggered the automatic query correction.

                '
            correctedQuery:
              type: string
              description: 'If the query was automatically corrected, this property indicates the corrected basic query expression (`q`) that was executed instead of the original one.

                '
            corrections:
              type: array
              description: 'If the query wasn''t automatically corrected, this property contains the basic query expression (`q`) keyword corrections suggested by the _Did You Mean_ index feature.

                '
              items:
                $ref: '#/components/schemas/RestQueryCorrection'
            correctedQueryTrigger:
              type: string
              description: 'If the query was automatically corrected, this property indicates which strategy triggered the correction.


                Possible values: `whenNoResults`, `alwaysOnQS`

                '
        queryCorrections:
          type: array
          description: The query corrections suggested by the index, if the `enableDidYouMean` query parameter was set to `true`.
          example: []
          items:
            $ref: '#/components/schemas/RestQueryCorrection'
        refinedKeywords:
          type: array
          description: The refined keywords used by the Coveo ML automatic relevance tuning model.
          example:
          - v2
          - platform
          - cloud
          - coveo
          items:
            type: string
        groupByResults:
          type: array
          description: The Group By results returned by the query. These results are included in the order they were requested in the `groupBy` query parameter.
          items:
            $ref: '#/components/schemas/RestGroupByResult'
        categoryFacets:
          type: array
          description: Hierarchical data results corresponding the to hierarchical data in the query.
          items:
            $ref: '#/components/schemas/RestCategoryFacetResponse'
        facets:
          type: array
          description: The facet results returned by the query. These results are included in the order they were requested in the `facets` query parameter.
          items:
            $ref: '#/components/schemas/RestFacetResult'
        generateAutomaticFacets:
          type: object
          description: Automatically generated facets based on the `generateAutomaticFacets` request parameter.
          properties:
            facets:
              type: array
              items:
                $ref: '#/components/schemas/RestFacetResult'
        suggestedFacets:
          type: array
          description: A DNE facet suggestion.
          items:
            $ref: '#/components/schemas/RestSuggestedFacet'
        results:
          type: array
          description: The items returned for the query.
          items:
            $ref: '#/components/schemas/RestQueryResult'
        questionAnswer:
          $ref: '#/components/schemas/RestQuestionAnswer'
        extendedResults:
          type: object
          description: "Additional response attributes coming from the execution of query pipeline integrations.\n\nCurrently supported properties:\n  - `generativeQuestionAnsweringId`: A stream ID to access the generated answer."
          additionalProperties:
            type: string
          example:
            generativeQuestionAnsweringId: queryStream01_coveo_c784a8f6-aa62-4b24-9ca0-d6b483feaa31
    RestTokenParams:
      required:
      - userIds
      type: object
      properties:
        userIds:
          type: array
          description: The security identities to impersonate when authenticating a query with this search token.
          items:
            $ref: '#/components/schemas/RestUserId'
        userDisplayName:
          type: string
          description: 'The `userDisplayName` to pass when logging usage analytics search events.


            This information is leveraged in the **Analytics** section of the Coveo Cloud administration console.'
          example: Alice Smith
        userGroups:
          type: array
          description: 'The `userGroups` to pass when logging usage analytics search events.


            This information is leveraged in the **Analytics** section of the Coveo Cloud administration console.


            User groups can be also be used in query pipeline condition statements (e.g., `when $groups contains \"Employees\"`).'
          example:
          - Tech support agents
          - Employees
          items:
            type: string
        canSeeUserProfileOf:
          type: array
          description: 'The `username` and/or `visitorId` values whose corresponding usage analytics-recorded user profiles can be accessed using the search token.


            **Note:** This property is meant to be used when generating search tokens for users requiring contextual information about other users to improve search relevance (e.g., support agents using an insight panel).'
          example:
          - bjones@acme.com
          - dmoore@acme.com
          items:
            type: string
        pipeline:
          type: string
          description: 'The name of the query pipeline to use when authenticating a query with this search token.


            This query pipeline will take precedence over the possible output of all other query pipeline routing mechanisms when using this search token (see [Query Pipeline Routing Mechanisms and Rules](https://docs.coveo.com/en/1666/)).'
          example: InternalSearch
        filter:
          type: string
          description: 'The filter query expression to apply when authenticating a query with this search token.


            This expression will be merged with the constant part of the query expression (`cq`) using an `AND` operator.


            The filter can also be used in query pipeline condition statements (e.g., `when $constantQuery contains \"@source==KnowledgeBase\"`).'
          example: '@source==KnowledgeBase'
        searchHub:
          type: string
          description: 'The name of the search hub to enforce when authenticating a query with this search token.


            This value will override the `searchhub` parameter of the query itself, and will be passed as the `originLevel1` property value when logging usage analytics search events.


            The search hub can also be used in query pipeline condition statements (e.g., `when $searchhub is \"CommunityHub\"`).'
          example: SupportHub
        dictionaryFieldContext:
          type: object
          description: 'The [dictionary field](https://docs.coveo.com/en/2036/) context to enforce when authenticating a query with this search token.

            This value will override the `dictionaryFieldContext` parameter of the query itself.


            A dictionary field context is a key-value store where each pair corresponds to the name of a dictionary field to query, along with

            the key to target within that field.


            For example, suppose that in your index, the `@price` dictionary field contains different values for its `storeA` and `storeB` keys.

            Including `"dictionaryFieldContext": { "price": "storeA" }` when creating a search token means that, for any query made with that

            search token, any part of the query expression that targets the `@price` field will in fact only query the `storeA` values of that field.


            **Note:** This cannot be used at the same time as `allowedDictionaryFieldKeys`.'
        allowedDictionaryFieldKeys:
          $ref: '#/components/schemas/RestAllowedDictionaryFieldKeys'
        salesforceOrganizationId:
          type: string
          description: '**Internal:** The ID of Salesforce organization, used to differentiate Salesforce organizations linked to the same Coveo organization.'
          example: 00Df23090018W5bEAG
        validFor:
          type: integer
          description: 'The number of milliseconds the search token will remain valid for once it has been created.


            **Minimum value:** `900000` (i.e., 15 minutes)


            **Maximum/default:** `86400000` (i.e., 24 hours)'
          format: int32
          example: 3600000
          default: 86400000
        salesforceUser:
          type: string
          description: '**Internal:** This property is exposed for internal use by the Coveo for Salesforce integration.'
        salesforceCommunityUrl:
          type: string
          description: '**Internal:** This property is exposed for internal use by the Coveo for Salesforce integration.'
        salesforceFallbackToAdmin:
          type: boolean
          description: '**Internal:** This property is exposed for internal use by the Coveo for Salesforce integration.'
        usertype:
          type: string
          description: '**Internal:** This property is exposed for internal use by the Coveo for Salesforce integration.'
        licenseDefinitionKey:
          type: string
          description: '**Internal:** This property is exposed for internal use by the Coveo for Salesforce integration.'
        superUserToken:
          type: string
          description: This property is exposed for backward compatibility reasons only.
          deprecated: true
        commerce:
          $ref: '#/components/schemas/CommerceParameters'
        scope:
          type: integer
          description: This property is exposed for backward compatibility reasons only.
          format: int32
          deprecated: true
    ListFieldValuesResponse:
      type: object
      properties:
        values:
          type: array
          items:
            $ref: '#/components/schemas/ListFieldValuesValuesResponse'
      required:
      - results
      example:
        values:
        - value: red
          lookupValue: red
          numberOfResults: 182
        - value: green
          lookupValue: green
          numberOfResults: 142
    PipelineRuleParameters:
      type:
      - object
      - 'null'
      additionalProperties: true
      maxProperties: 255
      description: "This defines generic parameters to be used by rules.\nIt defines the \"scopes\", or in other words, the rules in which the parameters should be used.\nThe generic parameters are defined within a particular scope and are only be accessible inside of it.\nThis is a read-only parameter, so its value will not be overridden.\n\n`{\n  \"scope\": {\n    \"parameterName\" : \"parameterValue\"\n  }\n}`\n\nWhile using Gen AI, if additional document fields are required for the resulting\ncitations, these fields can be specified through the 'citationsFieldToInclude'\nproperty of the 'mlGenerativeQuestionAnswering' scope.\n\n> **Note:**\n> Getting dictionary fields for citations is not supported.\n\n**Examples:**\n- `{\"mlGenerativeQuestionAnswering\": { \"responseFormat\": { \"answerStyle\": \"bullet\" } } }`\n- `{\"mlGenerativeQuestionAnswering\": { \"citationsFieldToInclude\": [\"field1\", \"field2\"] } }`\n\nMax Size: 1KB\n"
      example:
        genqa:
          responseFormat:
            answerStyle: bullet
    RestCategoryFacetResponse:
      type: object
      properties:
        field:
          type: string
        values:
          $ref: '#/components/schemas/RestCategoryFacetValue'
        parentValues:
          $ref: '#/components/schemas/RestCategoryFacetValue'
    ErrorMessage:
      type: object
      additionalProperties: true
      properties:
        statusCode:
          type: number
          example: 404
        errorCode:
          type: string
          example: ORGANIZATION_DOES_NOT_EXIST
        message:
          type: string
          example: The organization does not exist in the search api.
    RestFacetSpecificValue:
      allOf:
      - $ref: '#/components/schemas/RestFacetValueBase'
      - $ref: '#/components/schemas/RestFacetValueSpecificBase'
  parameters:
    MlParameters:
      name: mlParameters
      in: query
      description: 'A map of options to pass to the Coveo ML models associated with the request''s target query pipeline.


        **Available parameters:**

        - `considerUserContext` (boolean): Whether the models should attempt to leverage the `context` object of the request to personalize their output. Applies to CR models only. Default is `true`.

        - `maxActionsHistoryItemsToConsider` (unsigned integer): The maximum number of items in the `actionsHistory` array of the request that should be taken into account by the models. Applies to CR models only. By default, all `actionsHistory` items are considered.

        - `num` (unsigned integer): The maximum number of recommendations/suggestions to request from the models. Must be in range [1, 50], if specified. Applies to ART, CR, and QS models. Default depends on model configuration.

        - `padding` (string enum): The kind of padding the models should complete their output with, if their maximum number of recommendations/suggestions (i.e., `num`) has not been reached. Applies to CR models only. Allowed values are `popular` (i.e., pad recommendations with all time most popular items) and `trending` (i.e., pad recommendations with items that have recently been increasingly popular). By default, no padding applies.

        - `wordSelection` (string): The ITD keyword selection options the models should use. Applies only to ART models with ITD enabled. If specified, must be a string in the format `option:value`. The only available option is `wordsKept` (i.e., the maximum number of `lq` keywords to inject in `q`); its default value is `5`.

        - `minNumberOfWords` (unsigned integer): The minimum number of words a query suggestion may contain to be returned by the model. Applies to QS models only. Must be in range [1, 10] Default is `1`, which implies that the model will return all candidates.

        - `itemId` (string): The unique identifier (e.g., SKU) of a product to get recommendations for. Only applies when querying a Product Recommendations model with an association strategy considering a single item as an input.

        - `itemIds` (array of strings): The unique identifiers (e.g., SKUs) of the products to get recommendations for. Only applies when querying a Product Recommendations model with an association strategy considering multiple items as an input.

        - `categoryFilter` (string): The name of a category of products to get recommendations for.

        - `brandFilter` (string): The name of a brand of products to get recommendations for.

        - `filters` (map of strings): The dimensions along with the values to be used at query time by the model as filters for potential suggestions. Only applies to ART, QS, and DNE models that don''t use the default `filterFields` advanced parameter values. **Example:** `"filters": { "originContext": "<MY-VALUE>", "originLevel2": "<MY-VALUE>" }`.


        **Examples:**

        - `{"num": 3, "padding": "trending", "maxActionsHistoryItemsToConsider": 10, "considerUserContext": false}`

        - `{"wordSelection": "wordsKept:4"}`

        '
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    DictionaryFieldContext:
      name: dictionaryFieldContext
      in: query
      description: 'A key-value store where each pair corresponds to the name of a dictionary field to query, along with the key to target within that field.


        **Example:** Suppose that in your index, the `@price` dictionary field contains different values for its `storeA` and `storeB` keys. Including `"dictionaryFieldContext": { "price": "storeA" }` in the query means that any part of the query expression that targets the `@price` field will in fact only query the `storeA` values of that field.


        **Note:** This cannot be used at the same time as `fieldAliases`.


        **Note:** This parameter will be overridden if the search request is authenticated by a [search token](https://docs.coveo.com/en/56/) that enforces a specific [`dictionaryFieldContext`](https://docs.coveo.com/en/56/#dictionaryfieldcontext-object-optional).

        '
      content:
        application/json:
          schema:
            type: object
    Index:
      name: index
      in: query
      description: 'The identifier of the index mirror to forward the request to. See also the `indexToken` parameter.


        If you do not specify an `index` (or `indexToken`) value, any index mirror could be used.


        **Note:** Passing an `index` (or `indexToken`) value has no effect when the results of a specific request can be returned from cache (see the `maximumAge` parameter).

        '
      schema:
        type: string
    Referrer:
      name: referrer
      in: query
      description: 'The third level of origin of the request, typically the URL of the page that linked to the search interface from which the request originates (e.g., in JavaScript, this would correspond to the `document.referrer` value).


        Coveo Machine Learning models may use this information to provide contextually relevant output.


        **Note:** When logging a **Search** usage analytics event for a query, the `originLevel3` field of that event should be set to the `referrer` value of the query, if specified.


        See also the `context` parameter.

        '
      schema:
        type: string
    IsGuestUser:
      name: isGuestUser
      in: query
      description: 'Whether the current user is anonymous.


        Coveo Machine Learning models may use this information to provide contextually relevant output.


        **Note:** When logging a **Search** usage analytics event for a query, the `anonymous` field of that event should be set to the `isGuestUser` value of the query.


        **Default:** `false`

        '
      schema:
        type: boolean
    MlDidYouMeanUseFacetCount:
      name: mlDidYouMeanUseFacetCount
      in: query
      description: 'Whether to use facet counts for the Coveo ML Did You Mean feature. Can improve results, but requires more processing.


        **Default:** `false`

        '
      schema:
        type: boolean
    SearchHub:
      name: searchHub
      in: query
      description: 'The first level of origin of the request, typically the identifier of the graphical search interface from which the request originates.


        Coveo Machine Learning models use this information to provide contextually relevant output.


        **Notes:**


        - This parameter will be overridden if the search request is authenticated by a [search token](https://docs.coveo.com/en/56/) that enforces a specific [`pipeline`](https://docs.coveo.com/en/56/#pipeline-string-optional), or a [`searchHub`](https://docs.coveo.com/en/56/#searchhub-string-optional) that routes queries to a specific `pipeline` via a query pipeline condition.

        - When logging a **Search** usage analytics event for a query, the `originLevel1` field of that event should be set to the value of the `searchHub` search request parameter.


        See also the `tab` parameter.

        '
      schema:
        type: string
    DisableQuerySyntax:
      name: disableQuerySyntax
      in: query
      deprecated: true
      description: This parameter is exposed for backward compatibility reasons. Use the `enableQuerySyntax` parameter instead.
      schema:
        type: boolean
    PartialMatchThreshold:
      name: partialMatchThreshold
      in: query
      description: 'An absolute or relative value indicating the minimum number (rounded up) of partial match expression keywords an item must contain to match the expression.


        If specified, the `partialMatchThreshold` value must either be:


        - a 32-bits unsigned integer (e.g., `3`),

        - a percentage value between 0% and 100% (e.g., `75%`),

        - the empty string, or

        - the `all` string.


        The `""` and the `all` value are both equivalent to `100%`.


        **Notes:**


        - This parameter has no meaning unless the `partialMatch` parameter is set to `true`.

        - A keyword and its stemming expansions count as a single keyword when evaluating whether an item meets the `partialMatchThreshold`.


        See also the `partialMatchKeywords` parameter.


        **Examples:**


        - `3`

        - `75%`

        - `all`


        **Default:** `50%`'
      schema:
        type: string
    FieldsToInclude:
      name: fieldsToInclude
      in: query
      description: 'The names of the fields to include with each item in the query results. If specified, no other fields will be included.


        **Note:** If you specify both an array of fields to include and an array of fields to exclude (see the `fieldsToExclude` parameter), the `fieldsToExclude` parameter has no effect at all.


        If you do not explicitly specify an array of values for this parameter (or for the `fieldsToExclude` parameter), each query result item will include all of its available fields.

        '
      content:
        application/json:
          schema:
            type: array
            items:
              type: string
    ViewAllContentQuery:
      name: viewAllContent
      in: query
      description: Whether to bypass document permissions. Only effective if the access token grants the **Search - View all content** privilege.
      schema:
        type: boolean
    MlDidYouMeanMaxCandidates:
      name: mlDidYouMeanMaxCandidates
      in: query
      description: 'The maximum number of Coveo ML Did You Mean candidates to request from the query suggestions model.


        **Default:** `3`

        '
      schema:
        type: integer
        format: int32
    Q:
      name: q
      in: query
      description: 'The basic query expression, typically the keywords entered by the end user in a query box.


        **Note:** When logging a **Search** usage analytics event for a query, the `queryText` field of that event should be set to the `q` value of the corresponding query.

        '
      schema:
        type: string
    CQ:
      name: cq
      in: query
      description: 'The constant query expression, typically populated with expressions that must apply to all queries sent from a specific search interface (e.g., from a specific tab). Once evaluated, the result sets of those expressions are kept in a special cache.


        **Tip:** Avoid including dynamic content in the constant query expression. Otherwise you risk filling up the cache with useless data, which can have a negative impact on performance.


        **Notes:**


        - Other parts of the query expression can also benefit from the index cache (see the `maximumAge` parameter). However, using the constant query expression allows you to explicitly cache specific result sets.

        - Temporal keywords (`now`, `today`, `yesterday`) in the constant query expression are only re-evaluated once per 3-4 minutes; therefore, you should avoid basing `cq` expressions on temporal keywords if you require split second accuracy.

        '
      schema:
        type: string
    LQ:
      name: lq
      in: query
      description: 'The large query expression, typically populated with a case description, long textual query, or any other form of text that can help refine a query. The Coveo ML Intelligent Term Detection (ITD) feature can extract relevant keywords from the large query expression and inject those keywords in the basic query expression (see the `q` parameter).

        '
      schema:
        type: string
    StaticQuery:
      name: staticQuery
      in: query
      description: 'Whether to execute this query in a way that does not count against the allowed number of queries per month of a Coveo Cloud organization (QPM), but may produce cached/outdated query results (see [Rendering Static Content Using Persistent Queries](https://docs.coveo.com/en/1009/)).


        **Note:** Setting this parameter to `true` overwrites the `maximumAge` parameter value for this query.


        **Default:** `false`

        '
      schema:
        type: boolean
    SortField:
      name: sortField
      in: query
      description: This parameter is exposed for backward compatibility reasons. Use the `sortCriteria` parameter along with the `@[field] ascending/@[field] descending` syntax instead.
      schema:
        type: string
      deprecated: true
    FilterField:
      name: filterField
      in: query
      description: 'The `@`-prefixed name of the field to use to group items into distinct folded query results (see [Result Folding](https://docs.coveo.com/en/1466/)).


        Use a field whose value is identical for all items to group under the same folded query result.


        See also the `parentField`, `childField`, and `filterFieldRange` parameters.


        **Notes:**


        - Result folding and duplicate filtering (using the `enableDuplicateFiltering` parameter) are mutually exclusive.

        '
      schema:
        type: string
    EnableDuplicateFiltering:
      name: enableDuplicateFiltering
      in: query
      description: 'Whether to filter out duplicates, so that items resembling one another only appear once in the query results.


        **Notes:**

        - Two items must be at least 85% similar to one another to be considered duplicates.

        - When a pair of duplicates is found, only the higher-ranked item of the two is kept in the result set.

        - Enabling this feature can make the total result count less precise, since only results up to those being retrieved (see the `firstResult` and `numberOfResults` parameters) are submitted to duplicate filtering.

        - Duplicate filtering and [result folding](https://docs.coveo.com/en/1466/) are mutually exclusive.


        **Default:** `false`

        '
      schema:
        type: boolean
    LowerCaseOperators:
      name: lowercaseOperators
      in: query
      description: 'Whether to treat the `AND`, `NEAR`, `NOT`, and `OR` keywords in the basic query expression (see the `q` parameter) as Coveo Cloud query syntax operators even if those keywords are in lowercase.


        **Note:** Setting this parameter to `true` has no effect unless you also set the `enableQuerySyntax` parameter to `true`.


        **Example:** If you set this parameter, and the `enableQuerySyntax` parameter to `true`, the index interprets the `near` keyword in the basic query expression `service center near me` as the `NEAR` Coveo Cloud query syntax operator.


        **Default:** `false`

        '
      schema:
        type: boolean
    QueryFunctions:
      name: queryFunctions
      in: query
      description: 'The array of [query functions](https://docs.coveo.com/en/1451/) to execute on each query result item.


        The result of a query function is stored in a temporary, dynamic field created at query time.

        '
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/RestQueryFunction'
    Locale:
      name: locale
      in: query
      description: 'The locale of the current user. Must comply with IETF''s [BCP 47](http://www.rfc-editor.org/rfc/bcp/bcp47.txt) definition.


        Coveo Machine Learning models use this information to provide contextually relevant output. Moreover, this information can be referred to in query expressions and QPL statements by using the `$locale` object.


        **Note:** When logging a **Search** usage analytics event, the `language` field of that event should match the language part of the `locale` value of the query (e.g., `en-US` in `locale` becomes `en` in `language`).

        '
      schema:
        type: string
    CommerceParameters:
      name: commerce
      in: query
      description: The parameters for Coveo for Commerce.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RestCommerceParameters'
    PartialMatchKeywords:
      name: partialMatchKeywords
      in: query
      description: 'The minimum number of keywords that need to be present in a basic expression to convert it to a partial match expression.


        **Notes:**


        - This parameter has no meaning unless the `partialMatch` parameter is set to `true`.

        - Repeated keywords in a basic expression count as a single keyword.

        - Thesaurus expansions in a basic expression count towards the `partialMatchKeywords` count.

        - Stemming expansions **do not** count towards the `partialMatchKeywords` count.


        See also the `partialMatchThreshold` parameter.


        **Default:** `5`

        '
      schema:
        type: integer
        format: int32
    ExcerptLength:
      name: excerptLength
      in: query
      description: 'The maximum length of result excerpts (in number of characters).


        An *excerpt* is a segmented text generated at query time by the index from the body of an item. When a query is performed, the *excerpt* yields relevant item body sections in which the queried terms are highlighted.


        An *excerpt* includes the most relevant sentences in which the queried keywords appear, in the order in which they appear in the item, up to the specified number of characters.


        **Note:** The maximum length you set using this parameter also applies to retrieved first sentences, if those are included in the results (see the `retrieveFirstSentences` parameter).


        **Default:** `200`

        '
      schema:
        type: integer
        format: int32
    FieldsToExclude:
      name: fieldsToExclude
      in: query
      description: 'The names of the fields to exclude from the query results. All other fields will be included with each item in the query result.


        **Note:** If you specify both an array of fields to include (see the `fieldsToInclude` parameter) and an array of fields to exclude, the `fieldsToExclude` parameter has no effect at all.


        If you do not explicitly specify an array of values for this parameter (or for the `fieldsToInclude` parameter), each query result item will include all of its available fields.

        '
      content:
        application/json:
          schema:
            type: array
            items:
              type: string
    ActionsHistory:
      name: actionsHistory
      in: query
      description: 'The query and page view actions previously made by the current user.


        Coveo Machine Learning event recommendations models use this information to provide contextually relevant output.


        **Note:** Page view actions are typically populated by the [coveo.analytics.js](https://github.com/coveo/coveo.analytics.js) script.'
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ActionHistory'
    Context:
      name: context
      in: query
      description: 'The custom context information to send along with the request. Must be a dictionary of key-value pairs (JSON) where each key is a string, and each value is either a string or an array of strings.


        Coveo Machine Learning models may use this information to provide contextually relevant output. Moreover, this information can be referred to in query expressions and QPL statements by using the `$context` object.


        **Note:** When logging a **Search** usage analytics event for a query, the `customData` field of that event should include the same data as the `context` parameter of the query. However, each `context` key included in `customData` must be prefixed by `context_` (e.g., the `userRoles` key in `context` becomes `context_userRoles` in `customData`).


        See also the `referrer` parameter.


        **Example** `{"userAgeRange":"25-35","userRoles":["PremiumCustomer","ProductReviewer"]}`

        '
      content:
        application/json:
          schema:
            type: object
    EnableQuerySyntax:
      name: enableQuerySyntax
      in: query
      description: 'Whether to interpret advanced Coveo Cloud query syntax as such in the basic query expression (see the `q` parameter). See also the `lowercaseOperators` parameter.


        **Default:** `true`

        '
      schema:
        type: boolean
    FirstResult:
      name: firstResult
      in: query
      description: 'The 0-based position of the first result to return in the non-paginated result set.


        Along with the `numberOfResults` parameter, this allows you to retrieve a specific page of result items.


        **Note:** This can''t be greater than the `maximumResults` value configured for your index. By default, `maximumResults` is set to 5,000 items.


        **Default:** `0`

        '
      schema:
        type: integer
        format: int32
    ChildField:
      name: childField
      in: query
      description: 'The `@`-prefixed name of the field to use to be able to identify an item as a child of another item in a folded query result (see [Result Folding](https://docs.coveo.com/en/1466/)).


        Use a field whose value points to the `parentField` value of the intended parent. Whenever an item is a child of another item, its `childField` value must be identical to the `parentField` value of that other item.


        See also the `filterField`, `parentField`, and `filterFieldRange` parameters.


        **Notes:**


        - In the index, the values of the `childField` must only contain alphanumerical characters. Using a `childField` whose values contain non-indexable characters (such as underscores) will make folding fail.

        - The values of the `childField` must contain 60 characters or less (60 being the default maximum of characters for a word in the index).

        - Result folding and duplicate filtering (using the `enableDuplicateFiltering` parameter) are mutually exclusive.

        '
      schema:
        type: string
    EnableDidYouMean:
      name: enableDidYouMean
      in: query
      description: 'Whether to enable the _Did You Mean_ feature of the index, which populates the `queryCorrections` property of a successful response with keyword correction suggestions.


        **Notes:**


        - The Did You Mean feature only processes the basic query expression (see the `q` parameter).

        - When both `enableDidYouMean` and `enableMLDidYouMean` parameter are set to `true`, the output of both features will appear in the `queryCorrections` array.

        - The Did You Mean feature will return no corrections when the query is processed by an automatic relevance tuning (ART) model whose Intelligent Term Detection (ITD) feature is enabled.


        **Default:** `false`

        '
      schema:
        type: boolean
    Timezone:
      name: timezone
      in: query
      description: 'The [tz database](https://en.wikipedia.org/wiki/List_of_tz_database_time_zones) identifier of the time zone to use to correctly interpret dates in the query expression and result items.


        If not specified, the default time zone of the server hosting the index is used.


        **Note:** While no Coveo Machine Learning model uses this information, it can nevertheless affect the ranking scores (and thus, potentially the order) of result items, as ranking expressions may be based on time constants.

        '
      schema:
        type: string
    DQ:
      name: dq
      in: query
      description: 'The disjunction query expression, typically populated by Coveo ML automatic relevance tuning models to ensure that relevant items are included in the query results. The disjunction query expression is merged with the other parts of the query expression using an `OR` operator. The resulting query expression is `(((q aq) OR (dq)) cq)`.

        '
      schema:
        type: string
    Debug:
      name: debug
      in: query
      description: 'Whether to force a successful response to include debug information.


        **Notes:**


        - Debug information can only appear in responses in the JSON format (see the `format` parameter).

        - Avoid setting this parameter to `true` in production, as it has a negative impact on query performance.


        **Default:** `false`

        '
      schema:
        type: boolean
    Format:
      name: format
      in: query
      description: 'The format of a successful response.


        - Use `json` to get the response in the JSON format.

        - Use `xlsx` to generate an Excel file containing the results (binary).


        **Note:** Debug information (see the `debug` parameter) can only appear in a response in the JSON format.


        **Default:** `json`

        '
      schema:
        type: string
    FilterFieldRange:
      name: filterFieldRange
      in: query
      description: 'The maximum number of items to include in the `childResults` array of a folded query result (see [Result Folding](https://docs.coveo.com/en/1466/)).


        See also the `filterField`, `parentField`, and `childField`.


        **Notes:**


        - Result folding and duplicate filtering (using the `enableDuplicateFiltering` parameter) are mutually exclusive.


        **Default:** `5`

        '
      schema:
        type: integer
        format: int32
    RetrieveFirstSentences:
      name: retrieveFirstSentences
      in: query
      description: 'Whether to include the first sentences of textual items in the query results.


        First sentences are typically useful when rendering result items such as emails, since the first few sentences of these kinds of items are often more relevant than a contextually generated excerpt (see the `excerptLength` parameter).


        **Note:** The maximum length of the retrieved sentences (in number of characters) is determined by the value of the `excerptLength` parameter.


        **Default:** `false`

        '
      schema:
        type: boolean
    UserActionParameter:
      name: userActions
      in: query
      description: The parameters allowing user actions to be retrieved in query results.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RestUserActionParameter'
    EnableMlDidYouMean:
      name: enableMLDidYouMean
      in: query
      description: '**Important:** This feature is still in an experimental state.


        Whether to enable the Coveo ML query suggestions _Did You Mean_ feature, which populates the `queryCorrections` property of a successful response with keyword correction suggestions.


        **Notes:**


        - The Coveo ML query suggestions Did You Mean feature only processes the basic query expression (see the `q` parameter).

        - When both `enableDidYouMean` and `enableMLDidYouMean` parameter are set to `true`, the output of both features will appear in the `queryCorrections` array.


        **Default:** `false`

        '
      schema:
        type: boolean
    LqPartialMatchMaxKeywords:
      name: lqPartialMatchMaxKeywords
      in: query
      description: 'The maximum number of keywords from the large query expression (see the `lq` parameter) that will be included in the partial match expression in case the Coveo ML Intelligent Term Detection (ITD) feature cannot extract relevant keywords from the large query expression.


        **Note:** This parameter applies as a fallback setting when no Coveo ML automatic relevance tuning model is available in the query pipeline to process a query that contains a non-null large query expression (`lq`).


        Setting this parameter to a high value can negatively impact the performance of queries, while setting it too low can produce less relevant results.


        See also the `lqPartialMatchThreshold` parameter.


        **Default**: `100`

        '
      schema:
        type: integer
        default: 100
    NumberOfResults:
      name: numberOfResults
      in: query
      description: 'The number of results to return.


        Along with the `firstResult` parameter, this allows you to retrieve a specific page of result items.


        This parameter also defines the maximum number of results which can be returned by the Coveo ML Recommendations feature.


        **Note:** The maximum `numberOfResults` value is 2,000 items.


        **Default:** `10`

        '
      schema:
        type: integer
        format: int32
        minimum: 0
    SummaryLength:
      name: summaryLength
      in: query
      description: 'The length of the automatically generated item summary.


        The Coveo Platform uses a linguistic algorithm that relies on term frequency and proximity to generate an item *summary* made of sentences identified to be the most important ones in the item.


        This *summary* is generated independently from the query, as opposed to a result item *excerpt*, which is generated based on query keywords.


        **Default:** `0`

        '
      schema:
        type: integer
        format: int32
    GroupBy:
      name: groupBy
      in: query
      description: 'The Group By operations to perform on the query results, typically to extract facets.

        '
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/RestGroupBy'
    MaximumAge:
      name: maximumAge
      in: query
      description: 'The maximum age of cached results, in milliseconds.


        If the results of a specific request are available in the cache, and if those results are no older than the `maximumAge` value, the service returns those results rather than forwarding a new query to the index.


        Such cache hits improve responsiveness but still count as queries in your queries per month (QPM) count.


        **Note:** This parameter is automatically overridden when `staticQuery` is set to `true`.


        **Default:** `-1` (which corresponds to the internal default value (15 minutes)

        '
      schema:
        type: integer
        format: int32
    MaximumTimeoutMs:
      name: maximumTimeoutMs
      in: query
      description: 'The maximum number of milliseconds to allow the request to last before timing out.

        **Maximum:** 10000


        **Minimum/Default:** 0, meaning that Coveo determines the most appropriate timeout to use.


        '
      schema:
        type: integer
        format: int32
    IndexType:
      name: indexType
      in: query
      description: 'The type of index against which to execute the query. Must correspond to an index that has been configured for the target Coveo Cloud organization.


        **Default:** `coveo`

        '
      schema:
        type: string
    IndexToken:
      name: indexToken
      in: query
      description: 'The Base64 encoded identifier of the index mirror to forward the request to. See also the `index` parameter.


        If you do not specify an `indexToken` (or `index`) value, any index mirror could be used.


        **Note:** Passing an `indexToken` (or `index`) value has no effect when the results of a specific request can be returned from cache (see the `maximumAge` parameter).

        '
      schema:
        type: string
    VisitorId:
      name: visitorId
      in: query
      deprecated: true
      description: 'A GUID which represents the current user, who can either be authenticated or anonymous.


        `visitorId` is deprecated and has been replaced by [`clientId`](https://docs.coveo.com/en/masb0234/) in newer versions of the Coveo UI libraries. For compatibility, the new first-party cookie and local storage values are still named `coveo_visitorId`.


        For older versions of the JavaScript Search Framework, the visitor ID is generated by the Coveo Usage Analytics service and stored in a non-expiring third-party cookie. **Note:** Third-party cookies [have also been deprecated](https://docs.coveo.com/en/m54b9238/). This is unrelated to the deprecation of `visitorId`.

        '
      schema:
        type: string
    CategoryFacets:
      name: categoryFacets
      in: query
      description: 'Data to easily query a hierarchical field using a path of hierarchical values.

        '
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/RestCategoryFacetRequest'
    Tab:
      name: tab
      in: query
      description: "The second level of origin of the request, typically the identifier of the selected tab in the graphical search interface from which the request originates.\n\nCoveo Machine Learning models use this information to provide contextually relevant output.\n\n**Note:** When logging a **Search** usage analytics event for a query, the `originLevel2` field of that event should be set to the `tab` value of the query (or to the `\"default\"` string, if no `tab` value was specified in the query).\n\n      See also the `searchHub` parameter.\n"
      schema:
        type: string
    Pipeline:
      name: pipeline
      in: query
      description: 'The name of the query pipeline to use for this request (bypassing its conditions, if it has any).


        You can pass an empty `pipeline` value to use an empty query pipeline (i.e., `?pipeline=` or `"pipeline": ""`).


        If a query does not contain the `pipeline` parameter, the first query pipeline whose conditions are met by the request is used (query pipelines without conditions are not evaluated). Should the request fail to meet the conditions of each evaluated query pipeline, the default query pipeline of the target Coveo Cloud organization is used (bypassing its conditions, if it has any).


        **Notes:**


        - This parameter will be overridden if the search request is authenticated by a [search token](https://docs.coveo.com/en/56/) that enforces a specific [`pipeline`](https://docs.coveo.com/en/56/#pipeline-string-optional), or a [`searchHub`](https://docs.coveo.com/en/56/#searchhub-string-optional) that routes queries to a specific `pipeline` via a query pipeline condition.

        - For reporting purposes, when logging a **Search** usage analytics event for a query, the `queryPipeline` field of that event should be set to the final `pipeline` value used in the query execution. This value is determined from the query response. If no pipeline was specified, it uses the `"default"` value.

        - When using this parameter to list field values, not all query pipeline rules are supported. The only supported ones are [stop](https://docs.coveo.com/en/1446), [thesaurus](https://docs.coveo.com/en/3405) and [queryParamOverride](https://docs.coveo.com/en/1491).


        See also [Managing Query Pipelines](https://docs.coveo.com/en/1450/).

        '
      schema:
        type: string
    FacetOptions:
      name: facetOptions
      in: query
      description: 'The global configuration options that apply to all facet requests performed along with the query (see the `facets` query parameter).

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RestFacetOptions'
    LqPartialMatchThreshold:
      name: lqPartialMatchThreshold
      in: query
      description: 'An absolute or relative value indicating the minimum number of partial match expression keywords an item must contain to match the large query expression in case the Coveo ML Intelligent Term Detection (ITD) feature cannot extract relevant keywords from the large query expression.


        If specified, the `lqPartialMatchThreshold` value must either be:


        - a 32-bits unsigned integer (e.g., `3`),

        - a percentage value between 0% and 100% (e.g., `75%`),

        - the empty string (`""`), or

        - the `all` string.


        The `""` and `all` values are both equivalent to `100%`.


        **Note:** This parameter applies when no Coveo ML automatic relevance tuning model is available in the query pipeline to process a query that contains a non-null large query expression (`lq`).


        See also the `lqPartialMatchKeywords` parameter.


        **Examples:**


        - `3`

        - `75%`

        - `all`


        **Default:** `50%`

        '
      schema:
        type: string
    OrganizationIdQuery:
      name: organizationId
      in: query
      description: 'The unique identifier of the target Coveo Cloud organization.


        Specifying a value for this parameter is only necessary when you are authenticating the API call with an OAuth2 token.'
      example: mycoveocloudv2organization
      schema:
        type: string
    QuestionMark:
      name: questionMark
      in: query
      description: 'Whether to enable question mark characters (`?`) in the *wildcards* feature of the index in order to expand basic expression keywords (see the `q` parameter) containing question mark characters (`?`) to the possible matching keywords.


        **Note:** Setting this parameter to `true` has no effect unless you also set the `wildcards` parameter to `true`.


        See [Using Wildcards in Queries](https://docs.coveo.com/en/1580/).


        **Default:** `false`

        '
      schema:
        type: boolean
        default: false
    ParentField:
      name: parentField
      in: query
      description: 'The `@`-prefixed name of the field to use to be able to identify an item as a parent in a folded query result (see [Result Folding](https://docs.coveo.com/en/1466/)).


        Use a field whose value can uniquely identify each item. All items whose `childField` value is identical to the `parentField` value of another item are considered children of that other item.


        See also the `filterField`, `childField`, and `filterFieldRange` parameters.


        **Notes:**


        - In the index, the values of the `parentField` must only contain alphanumerical characters. Using a `childField` whose values contain non-indexable characters (such as underscores) will make folding fail.

        - The values of the `parentField` must contain 60 characters or less (60 being the default maximum of characters for a word in the index).

        - Result folding and duplicate filtering (using the `enableDuplicateFiltering` parameter) are mutually exclusive.

        '
      schema:
        type: string
    Recommendation:
      name: recommendation
      in: query
      description: 'The identifier of the recommendation interface from which the request originates (see [`CoveoRecommendation`](https://coveo.github.io/search-ui/components/recommendation.html)).


        Coveo Machine Learning event recommendations models may use this information to provide contextually relevant output.

        '
      schema:
        type: string
    LqPartialMatchKeywords:
      name: lqPartialMatchKeywords
      in: query
      description: 'The minimum number of keywords that need to be present in the large query expression (see the `lq` parameter) to convert it to a partial match expression in case the Coveo ML Intelligent Term Detection (ITD) feature cannot extract relevant keywords from the large query expression.


        **Note:** This parameter applies as a fallback setting when no Coveo ML automatic relevance tuning model is available in the query pipeline to process a query that contains a non-null large query expression (`lq`).


        See also the `lqPartialMatchThreshold` parameter.


        **Default**: `5`

        '
      schema:
        type: integer
        format: int32
    SortCriteria:
      name: sortCriteria
      in: query
      description: 'The criteria to use for sorting the query results.


        **Allowed values:**


        - `relevancy`: use standard index ranking factors (adjacency, TDIDF, etc.) and custom ranking expressions (QREs and QRFs) to compute a ranking `score` for each query result item, and sort the query results by descending `score` value.

        - `date ascending`/`date descending`: use the `@date` field to sort the query results. This field typically contains the last modification date of each item.

        - `qre`: use only custom ranking expressions (QREs and QRFs) to compute a ranking `score` for each query result item, and sort the query results by descending `score` value.

        - `nosort`: do not sort the query results; the index will return result items in an essentially random order.

        - `@[field] ascending`/`@[field] descending`: sort using the value of a specific sortable field (replace `[field]` by the target field name).


        You can specify a list of comma-separated sort criteria which will be applied sequentially, i.e., if there''s a tie on the 1st criterion, the API uses the 2nd criterion to break the tie.

        However, this only works when combining:

        - a `relevancy` criterion followed by one or more field or `date` criteria.

        - a `qre` criterion followed by one or more field or `date` criteria.

        - two or more field criteria (e.g., `@views descending,@likes descending`).

        - a single `date` criterion and one or more field criteria in any order (e.g., `@views descending, date ascending`).


        **Examples:**


        - `date ascending`

        - `@author ascending`

        - `date descending,@views descending,@likes descending`


        **Default:** `relevancy`

        '
      schema:
        type: string
    Wildcards:
      name: wildcards
      in: query
      description: 'Whether to enable the *wildcards* feature of the index in order to expand basic expression keywords (see the `q` parameter) containing wildcard characters (`*`) to the possible matching keywords. See also the `questionMark` parameter.


        See [Using Wildcards in Queries](https://docs.coveo.com/en/1580/).


        **Default:** `false`

        '
      schema:
        type: boolean
    AnalyticsRequestParameters:
      name: analytics
      in: query
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AnalyticsRequestParameters'
    AQ:
      name: aq
      in: query
      description: 'The advanced query expression, typically generated by code (e.g., when toggling facet values).


        **Note:** When logging a **Search** usage analytics event for a query, the `advancedQuery` field of that event should be set to the `aq` value of the corresponding query (for reporting purposes).

        '
      schema:
        type: string
    Language:
      name: language
      in: query
      description: This parameter is exposed for backward compatibility reasons. Use the `locale` parameter instead.
      schema:
        type: string
      deprecated: true
    PartialMatch:
      name: partialMatch
      in: query
      description: 'Whether to convert a basic expression containing at least `partialMatchKeywords` to a _partial match expression_, so that any item containing at least `partialMatchThreshold` of those keywords will match the expression.


        If you do not set this parameter to `true`, an item must contain all of the basic expression keywords to match the expression.


        **Notes:**


        - This feature only applies to the basic expression (`q`) of a query, and to the basic `queryOverride` of its Group By operations.

        - When the `enableQuerySyntax` parameter is set to `true`, this feature has no effect on a basic expression containing advanced Coveo Cloud query syntax (field expressions, operators, etc.).


        **Default:** `false`

        '
      schema:
        type: boolean
    Facets:
      name: facets
      in: query
      description: 'The facet operations to perform on the query results.

        '
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/RestFacetRequest'
    MlDidYouMeanMinScore:
      name: mlDidYouMeanMinScore
      in: query
      description: 'The minimum score a query suggestion may have to be allowed as a candidate for the Coveo ML query suggestions Did You Mean feature. For best results, value should typically be in range [`0.8`, `2`].


        **Default:** `1.0`

        '
      schema:
        type: number
        format: double
    RankingFunctions:
      name: rankingFunctions
      in: query
      description: 'The array of [ranking functions](https://docs.coveo.com/en/1448/) to execute on each query result item.


        The result of a ranking function is added to the result score, which can affect sorting (see the `Relevancy` and `qre` values of the `sortCriteria` parameter).

        '
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/RestRankingFunction'
    LogicalIndex:
      name: logicalIndex
      in: query
      description: 'The identifier for a logical group of indexes that have been configured to include documents from the same sources.


        If you do not specify a `logicalIndex` value, the `default` grouping will be used, typically including all indexes.

        '
      schema:
        type: string
  responses:
    NotFound:
      description: 'Not Found (see: https://docs.coveo.com/en/1471/build-a-search-ui/troubleshoot-query-error-codes#404-not_found)'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          example:
            statusCode: 404
            message: The requested Search API endpoint does not exist.
            errorCode: NOT_FOUND
    TooManyRequests:
      description: 'Too Many Requests (see: https://docs.coveo.com/en/1471/build-a-search-ui/troubleshoot-query-error-codes#429-too_many_requests)'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          example:
            statusCode: 429
            message: Too many requests.
  securitySchemes:
    oauth2:
      type: oauth2
      description: This API uses OAuth 2 with the implicit grant flow.
      flows:
        implicit:
          authorizationUrl: https://platform.cloud.coveo.com/oauth/authorize
          scopes:
            full: required
    platformTokens:
      type: http
      description: Platform tokens are used to authenticate requests to the platform as a specific user. See [Use platform token authentication](https://docs.coveo.com/en/n3ge0020).
      scheme: bearer
      bearerFormat: JWT
    searchTokens:
      type: http
      description: Search tokens are used to authenticate search-related API requests. See [Use search token authentication](https://docs.coveo.com/en/56).
      scheme: bearer
      bearerFormat: JWT
    apiKey:
      description: API keys are used to authenticate requests to the platform as a specific user. See [Use API key authentication with the Search API](https://docs.coveo.com/en/105).
      type: http
      scheme: bearer
