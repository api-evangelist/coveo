          type: string
        context:
          type: string
    Index:
      type:
      - string
      - 'null'
      description: 'The identifier of the index mirror to forward the request to. See also the `indexToken` parameter.


        If you do not specify an `index` (or `indexToken`) value, any index mirror could be used.


        **Note:** Passing an `index` (or `indexToken`) value has no effect when the results of a specific request can be returned from cache (see the `maximumAge` parameter).

        '
      example: myorg-nvoqun-Indexer1-pbi2nbuw
    RestFacetSearchParametersSpecific:
      required:
      - field
      type: object
      properties:
        field:
          type: string
          description: The name of the field against which to execute the facet search request.
          example: color
        type:
          type: string
          description: 'The facet type to search against.


            **Allowed values:**

            - `specific`

            - `hierarchical`


            **Default:** `specific`'
          enum:
          - specific
          - hierarchical
        numberOfValues:
          type: integer
          description: 'The maximum number of values to fetch.


            **Default:** `10`'
          format: int32
          default: 10
        query:
          type: string
          description: 'The string to match.


            **Note:** Typically, this should be set to the text that the end user typed in the facet search box, to which wildcard characters (`*`) may be added.'
          example: '*oran*'
        captions:
          type: object
          additionalProperties:
            type: string
          description: 'A dictionary that maps index field values to facet value display names.


            **Note:**


            When specifying display captions for hierarchical facet values, you can use full values (e.g., `all;electronics;laptops`), and/or for "leaf" values (e.g., `laptops`) as keys. If a hierchical facet value can be mapped to two different display captions, the most specific mapping (i.e., the one whose key is the full value) applies.


            **Examples:**


            - Specific (i.e., scalar) facet values: `{"#FF8000": "Orange", "#8000FF": "Purple"}`

            - Hierarchical facet values:** `{"all;electronics;laptops": "Laptops", "smartphones": "Smart Phones"} '
          example:
            acme_productA: ACME Product A
            acme_productB: ACME Product B
        filterFacetCount:
          type: boolean
          description: 'Whether to exclude folded result parents when estimating the result count for each facet value.


            **Note:** The target folding field must be a facet field with the **Use cache for nested queries** options enabled (see [Manage fields](https://docs.coveo.com/en/1833/)).


            **Default:** `false`'
          example:
          - - Electronics
            - Entertainment
            - Gaming Consoles
          - - Appliances
            - Kitchen
          items:
            type: array
            items:
              type: string
        sortCriteria:
          type: string
          enum:
          - score
          - alphanumeric
          - alphanumericNatural
          - occurrences
          default: alphanumeric
          description: 'The sort criterion to apply to the returned facet values.


            **Allowed values**:


            - `alphanumeric`: Sort values in ascending alphanumeric order.

            - `alphanumericNatural`: Sort values in ascending alphanumeric order using [natural sorting](https://en.wikipedia.org/wiki/Natural_sort_order).

            - `occurrences`: Sort by number of occurrences, so that field values with the highest number of occurrences appear first.

            - `score`: Sort values in descending score order. Facet value scores are based on the number of occurrences and their position in the ranked query result set.

            '
        ignoreValues:
          type: array
          items:
            type: string
          description: A list of index field values to filter out from the facet search results.
          example:
          - '#FF00FF'
          - '#00FFFF'
        searchContext:
          $ref: '#/components/schemas/RestQueryParameters'
    Tab:
      type:
      - string
      - 'null'
      description: 'The second level of origin of the request, typically the identifier of the selected tab in the graphical search interface from which the request originates.


        Coveo Machine Learning models use this information to provide contextually relevant output.


        **Note:** When logging a **Search** usage analytics event for a query, the `originLevel2` field of that event should be set to the `tab` value of the query (or to the `"default"` string, if no `tab` value was specified in the query).


        See also the `searchHub` parameter.

        '
      example: ForumTab
    ListFieldsResponse:
      type: object
      properties:
        fields:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              name:
                type: string
              nativeName:
                type: string
              description:
                type: string
              defaultValue:
                type: string
              fieldType:
                type: string
              fieldSourceType:
                type: string
              includeInQuery:
                type: boolean
              includeInResults:
                type: boolean
              groupByField:
                type: boolean
              splitGroupByField:
                type: boolean
              sortByField:
                type: boolean
            required:
            - type
            - name
            - nativeName
            - description
            - defaultValue
            - fieldType
            - fieldSourceType
            - includeInQuery
            - includeInResults
            - groupByField
            - splitGroupByField
            - sortByField
            example:
              type: text
              name: '@author'
              nativeName: author
              description: ''
              defaultValue: ''
              fieldType: LargeString
              fieldSourceType: System
              includeInQuery: false
              includeInResults: false
              groupByField: false
              splitGroupByField: false
              sortByField: false
    RestUserActionParameter:
      type: object
      properties:
        tagViewsOfUser:
          type: string
          description: 'The user ID or visitor ID to retrieve user actions for.


            **Note:** Only effective with authenticated users.


            **Examples:**

            - `asmith@example.com`

            - `c7ab60e2-e6b8-41e8-be6a-ad5c8edc662e`'
    MaximumTimeoutMs:
      type:
      - integer
      - 'null'
      description: 'The maximum number of milliseconds to allow the request to last before timing out.

        **Maximum:** 10000


        **Minimum/Default:** 0, meaning that Coveo determines the most appropriate timeout to use.


        '
      format: int32
      example: 10000
      default: 0
    RestListFieldValuesParameter:
      allOf:
      - $ref: '#/components/schemas/RestListFieldValuesParameterBase'
      - $ref: '#/components/schemas/RestCommonQueryParameters'
    RestCommonQueryParameters:
      type: object
      properties:
        pipeline:
