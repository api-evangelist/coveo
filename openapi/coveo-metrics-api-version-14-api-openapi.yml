openapi: 3.2.0
info:
  title: Usage Analytics Read Metrics API - Version 14 API
  version: '1.0'
servers:
- url: https://analytics.cloud.coveo.com/rest/ua
  description: Coveo public API endpoint
security:
- v8:
  - full
tags:
- name: Metrics API - Version 14
paths:
  /v14/metrics/{metricName}:
    get:
      tags:
      - Metrics API - Version 14
      summary: Get a Metric
      description: This endpoint is deprecated and will be removed on October 1st, 2024.
      operationId: get__v14_metrics_{metricName}
      parameters:
      - name: org
        in: query
        description: The name of the organization (Coveo Cloud V2 only)
        schema:
          type: string
      - name: metricName
        in: path
        description: metricName
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricResponseV14'
      deprecated: true
  /v14/metrics:
    get:
      tags:
      - Metrics API - Version 14
      summary: Get All the Metrics
      description: This endpoint is deprecated and will be removed on October 1st, 2024.
      operationId: get__v14_metrics
      parameters:
      - name: org
        in: query
        description: The name of the organization (Coveo Cloud V2 only)
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsResponseV14'
      deprecated: true
  /v14/metrics/monitoring/health:
    get:
      tags:
      - Metrics API - Version 14
      summary: Health Check for the Metrics Service
      description: This endpoint is deprecated and will be removed on October 1st, 2024.
      operationId: get__v14_metrics_monitoring_health
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
      deprecated: true
  /v14/metrics/status:
    get:
      tags:
      - Metrics API - Version 14
      summary: Get the Metrics Service Status
      description: This endpoint is deprecated and will be removed on October 1st, 2024.
      operationId: get__v14_metrics_status
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
      deprecated: true
components:
  schemas:
    MetricResponseV14:
      type: object
      properties:
        metricName:
          type: string
          description: The metric name. Also acts as a unique identifier.
        displayName:
          type: string
          description: A name that can be used for displaying the metric in UI.
        type:
          type: string
          description: The type of the metric value.
        higherIsBetter:
          type: boolean
          description: Whether a higher value is better. For example, higher clicks is better, higher average click rank is bad. A null value indicates that it depends on the context.
        percentage:
          type: boolean
          description: Whether the metric must be interpreted as a percentage.
        eventTypes:
          uniqueItems: true
          type: array
          description: The list of event types that might be used to calculate this metric.
          items:
            type: string
            description: The list of event types that might be used to calculate this metric.
      description: The details of a metric.
    MetricsResponseV14:
      type: object
      properties:
        metricResponses:
          type: array
          description: A collection of metrics.
          items:
            $ref: '#/components/schemas/MetricResponseV14'
      description: A collection of metrics.
    StatusResponse:
      type: object
      description: Service's status information
  securitySchemes:
    v8:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: https://platform.cloud.coveo.com/oauth/authorize
          scopes:
            full: ''
