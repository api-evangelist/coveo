definitions:
  ChunkOutArgs:
    properties:
      fileId:
        description: "The unique identifier of the file container.  \nYou can use this identifier as the `fileId` query parameter value when pushing a batch of items or security identities, or as the `compressedBinaryDataFileId` property value when pushing item data.  \n**Example:** `\"b5e8767e-8f0d-4a89-9095-1127915c89c7\"`"
        type: string
      requiredHeaders:
        additionalProperties:
          description: The HTTP headers to include when sending a `POST` request to the `uploadUri`.
          type: string
        type: object
      uploadUri:
        description: "The presigned URI of the file container.  \nYou can upload data into the file container by sending a `PUT` request whose body is your raw textual data to this URI.  \n**Example:** `\"https://s3.amazonaws.com/coveo-nprod-customerdata/proda/blobstore/[...]\"`"
        type: string
    type: object
  CatalogStreamOutArgs:
    properties:
      orderingId:
        description: A unique identifier that represents the order of the request. By default, the Stream API automatically sets this parameter to the current number of milliseconds since the Unix epoch, providing a timestamp that can also serve as a unique order ID.
        type: string
      requestId:
        requestId: A unique identifier for the request. This ID helps in tracking and identifying individual requests, ensuring that each request can be distinctly recognized.
        type: string
    type: object
  Error:
    properties:
      errorCode:
        type: string
      message:
        type: string
    type: object
  OpenStreamOutArgs:
    properties:
      fileId:
        description: "The unique identifier of the file container. \n**Example:** `\"b5e8767e-8f0d-4a89-9095-1127915c89c7\"`"
        type: string
      requiredHeaders:
        additionalProperties:
          description: The HTTP headers to include when sending a `POST` request to the `uploadUri`.
          type: string
        type: object
      streamId:
        description: "Unique identifier for the stream. \nThis identifier is required to request additional chunks in the stream, or to close the stream."
        type: string
      uploadUri:
        description: "The presigned URI of the file container.  \nYou can upload data into the file container by sending a `PUT` request whose body is your raw textual data to this URI.  \n**Example:** `\"https://s3.amazonaws.com/coveo-nprod-customerdata/proda/blobstore/[...]\"`"
        type: string
    type: object
