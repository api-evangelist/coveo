components:
  schemas:
    Error:
      properties:
        errorCode:
          type: string
        message:
          type: string
      type: object
    GetFacetsWithCountsResponseBodyModel:
      description: The retrieved values/counts for each type of indexing pipeline log entry facet.
      properties:
        operations:
          description: 'The retrieved _operation_ facet values/counts  (each key will be a valid _operation_ enum value).

            Example: `{"ADD": 50}`'
          type: object
        resourceIds:
          description: 'The retrieved _resourceId_ facet values/counts.

            Example: `{"mycoveocloudorganizationg8tp8wu3-qp2fnxukqw7voteaiahlxfkf7i": 10, "mycoveocloudorganizationg8tp8wu3-rnj3eisk4as63kx7zc4ch4keja": 3, "MAPPING_EXTENSION": 37}`'
          type: object
        results:
          description: 'The retrieved _result_ facet values/counts  (each key will be a valid _result_ enum value).

            Example: `{"SKIPPED": 3, "COMPLETED": 47}`'
          type: object
        sourceIds:
          description: 'The retrieved _sourceId_ facet values/counts.

            Example: `{"w1zh6p45vh7s2uxzvg3s7kg85m-mycoveocloudorganizationg8tp8wu3": 8,"xqgojoppe6qkojkotz7xsi2o3e-mycoveocloudorganizationg8tp8wu3": 42}`'
          type: object
        tasks:
          description: 'The retrieved _task_ facet values/counts (each key will be a valid _task_ enum value).

            Example: `{"MAPPING": 37, "EXTENSION": 13}`'
          type: object
      type: object
    GetFacetsResponseBodyModel:
      description: The retrieved values for each type of indexing pipeline log entry facet.
      properties:
        operations:
          description: 'The retrieved _operation_ facet values.

            Example: `["ADD"]`'
          items:
            $ref: '#/components/schemas/IndexingPipelineLogOperations'
          type: array
        resourceIds:
          description: 'The retrieved _resourceId_ facet values.

            Example: `["mycoveocloudorganizationg8tp8wu3-qp2fnxukqw7voteaiahlxfkf7i", "mycoveocloudorganizationg8tp8wu3-rnj3eisk4as63kx7zc4ch4keja", "MAPPING_EXTENSION"]`'
          items:
            type: string
          type: array
        results:
          description: 'The retrieved _result_ facet values.

            Example: `["SKIPPED", "COMPLETED"]`'
          items:
            $ref: '#/components/schemas/IndexingPipelineLogResults'
          type: array
        sourceIds:
          description: 'The retrieved _sourceId_ facet values.

            Example: `["w1zh6p45vh7s2uxzvg3s7kg85m-mycoveocloudorganizationg8tp8wu3", "xqgojoppe6qkojkotz7xsi2o3e-mycoveocloudorganizationg8tp8wu3"]`'
          items:
            type: string
          type: array
        tasks:
          description: 'The retrieved _task_ facet values.

            Example: `["MAPPING", "EXTENSION"]`'
          items:
            $ref: '#/components/schemas/IndexingPipelineLogTasks'
          type: array
      type: object
    IndexingPipelineLogTasks:
      description: The _task_ filter value.
      enum:
      - CONSUMING
      - CONSUMING_BATCH
      - CRAWLING
      - STREAMING_EXTENSION
      - EXTENSION
      - INDEXING
      - MAPPING
      - PROCESSING
      - STREAMING
      - STREAMING_BATCH
      - PREINDEXING
      - VALIDATION
      type: string
    IndexingPipelineLogResults:
      description: The _result_ filter value.
      enum:
      - COMPLETED
      - ERROR
      - REJECTED
      - SKIPPED
      - WARNING
      type: string
    GetLogsOrFacetsRequestBodyModel:
      properties:
        excludeOperations:
          description: The _operation_ values to filter out from the response. Entries matching other _operation_ values will be included.
          items:
            $ref: '#/components/schemas/IndexingPipelineLogOperations'
          type: array
        excludeResourceIds:
          description: The _resourceId_ values to filter out from the response. Entries matching other _resourceId_ values will be included.
          items:
            type: string
          type: array
        excludeResults:
          description: The _result_ values to filter out from the response. Entries matching other _result_ values will be included.
          items:
            $ref: '#/components/schemas/IndexingPipelineLogResults'
          type: array
        excludeSourceIds:
          description: The _sourceId_ values to filter out from the response. Entries matching other _sourceId_ values will be included.
          items:
            type: string
          type: array
        excludeTasks:
          description: The _task_ values to filter out from the response. Entries matching other _task_ values will be included.
          items:
            $ref: '#/components/schemas/IndexingPipelineLogTasks'
          type: array
        operations:
          description: The _operation_ values to allow in the response. Entries matching other _operation_ values will be filtered out (has priority over `excludeOperations`).
          items:
            $ref: '#/components/schemas/IndexingPipelineLogOperations'
          type: array
        resourceIds:
          description: The _resourceId_ values to allow in the response. Entries matching other _resourceId_ values will be filtered out (has priority over `excludeResourceIds`).
          items:
            type: string
          type: array
        results:
