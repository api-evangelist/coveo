  /organizations/{organizationId}/providers/{providerId}/permissions/olderthan:
    delete:
      description: In a specific security identity provider, disables all security identities whose last update was made by a Push API operation whose `orderingId` is strictly lower than a specified value.
      externalDocs:
        description: Disable old security identities
        url: https://docs.coveo.com/en/33/
      parameters:
      - description: "The unique identifier of the target security identity provider (see [Create a security provider](https://docs.coveo.com/en/85/index-content/create-or-update-a-security-identity-provider-for-a-secured-push-source#create-a-security-provider)).  \n**Example:** `My Secured Push Source Security Identity Provider`"
        in: path
        name: providerId
        required: true
        type: string
      - description: "The unique identifier of the target Coveo Cloud V2 organization.  \n**Example:** `mycoveocloudv2organizationg8tp8wu3`"
        in: path
        name: organizationId
        required: true
        type: string
      - description: "The lowest Push API operation timestamp value a security identity must be associated to in order not to be deleted from the security identity provider.  \n**Example:** `1506700606240`"
        format: int64
        in: query
        name: orderingId
        required: true
        type: integer
      - description: "A grace period (in minutes) whose purpose is to give the Coveo Cloud V2 indexing pipeline enough time to finish processing any previously enqueued operation that would affect the target Push source. Default value is 15 minutes.  \n**Example:** `5`"
        format: int32
        in: query
        minimum: 0
        name: queueDelay
        required: false
        type: integer
