components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://platform.cloud.coveo.com/oauth/authorize
          tokenUrl: https://platform.cloud.coveo.com/oauth/token
          scopes:
            full: required
definitions:
  EntityUpdateResult:
    properties:
      errorDetails:
        type: string
      result:
        enum:
        - Success
        - AccessDenied
        - TimedOut
        - EntityIsInvalid
        - EntityIsUnavailable
        - SecurityProviderIsUnavailable
        - SecurityProviderIsUnreachable
        - SecurityProviderIsNotReady
        - UnexpectedError
        type: string
    type: object
  MappedIdentityBody:
    properties:
      Result:
        $ref: '#/definitions/EntityUpdateResult'
        description: The security identity entity update result.
      identity:
        $ref: '#/definitions/Identity'
      mappings:
        items:
          $ref: '#/definitions/MappedIdentity'
          description: The security identities to establish an alias relationship with.
        type: array
      wellKnowns:
        items:
          $ref: '#/definitions/Identity'
          description: "The granted identities to give to this security identity alias.  \n**Notes:**  \n>- While all security identity types (i.e., `UNKNOWN`, `USER`, `GROUP`, and `VIRTUAL_GROUP`) are theoretically available, only security identities whose `type` is `GROUP` or `VIRTUAL_GROUP` should be given as granted identities.  \n>- For legacy reasons, the Push API requires you to specify *granted identities* in an array property whose name is `wellKnowns`."
        type: array
    type: object
  MappedIdentity:
    properties:
      additionalInfo:
        additionalProperties:
          type: string
        type: object
      name:
        description: "The unique name of the security identity to establish an alias relationship with.  \n**Example:** `\"alice@example.com\""
        type: string
      provider:
        description: "The unique identifier of the security identity provider where the security identity to establish an alias relationship with is defined.  \nThe security identity provider you are pushing the security identity alias to **must** cascade to this `provider`.  \n**Note:**  \n> Specifying a `provider` is only necessary when the security identity provider you are pushing the security identity alias to cascades to multiple security identity providers. If the target security identity provider cascades to a single security identity provider, the service automatically sets the `provider` value to the unique identifier of that cascading security identity provider.  \n**Example:** `\"My Security Identity Provider\""
        type: string
      type:
        description: "The type of the security identity to establish an alias relationship with.  \n**Note:**  \n> While all security identity types (i.e., `UNKNOWN`, `USER`, `GROUP`, and `VIRTUAL_GROUP`) are theoretically available, you should normally establish alias relationships exclusively between security identities whose `type` is `USER`.  \n**Example:** `\"USER\""
        enum:
        - USER
        - GROUP
        - VIRTUAL_GROUP
        - UNKNOWN
        type: string
    type: object
  Error:
    properties:
      errorCode:
        type: string
      message:
        type: string
    type: object
  IdentityBody:
    properties:
      Result:
        $ref: '#/definitions/EntityUpdateResult'
        description: The security identity entity update result.
      identity:
        $ref: '#/definitions/Identity'
      members:
        items:
          $ref: '#/definitions/Identity'
          description: "The security identities to include as children of this security identity.  \n**Notes:**  \n>- Only security identities whose `type` is `GROUP` or `VIRTUAL_GROUP` typically have an array of `members`.  \n>- A security identity in the `members` array can be of any valid `type` (i.e., `UNKNOWN`, `USER`, `GROUP`, or `VIRTUAL_GROUP`)."
        type: array
      wellKnowns:
        items:
          $ref: '#/definitions/Identity'
          description: "The granted identities to give to this security identity.  \n**Notes:**  \n>- While all security identity types (i.e., `UNKNOWN`, `USER`, `GROUP`, and `VIRTUAL_GROUP`) are theoretically available, only security identities whose `type` is `GROUP` or `VIRTUAL_GROUP` should be given as granted identities.  \n>- For legacy reasons, the Push API requires you to specify *granted identities* in an array property whose name is `wellKnowns`."
        type: array
    type: object
  BaseIdentityBody:
    properties:
      identity:
        $ref: '#/definitions/Identity'
    type: object
  Identity:
    properties:
      additionalInfo:
        additionalProperties:
          type: string
        type: object
      name:
        description: "The unique name of the security identity.  \n**Example:** `\"Alpha Group\""
        type: string
      type:
        description: "The security identity type.  \n- `UNKNOWN`: a security identity whose type is unknown.  \n- `USER`: an individual user security identity  \n- `GROUP`: an existing group in the original secured enterprise system. Groups can have members of any valid security identity `type` (i.e., `UNKNOWN`, `USER`, `GROUP`, or `VIRTUAL_GROUP`).  \n- `VIRTUAL_GROUP`: a group that does not exist in the original secured enterprise system. Mechanically, a `VIRTUAL_GROUP` works just like a `GROUP`.  \n**Example:** `\"GROUP\""
        enum:
        - USER
        - GROUP
        - VIRTUAL_GROUP
        - UNKNOWN
        type: string
    type: object
