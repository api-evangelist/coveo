components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://platform.cloud.coveo.com/oauth/authorize
          tokenUrl: https://platform.cloud.coveo.com/oauth/token
          scopes:
            full: required
definitions:
  PermissionIdentityModel:
    properties:
      identity:
        description: "The unique name of the security identity (see [Manage security identities in a security identity provider](https://docs.coveo.com/en/132/)).  \n**Example:** `\"asmith@example.com\"`"
        type: string
      identityType:
        description: "The type of the security identity (see [Manage security identities in a security identity provider](https://docs.coveo.com/en/132/)).  \n**Example:** `\"User\"`"
        enum:
        - User
        - Group
        - VirtualGroup
        - Unknown
        type: string
      securityProvider:
        description: "The unique name of the security identity provider in which the security identity is defined. Defaults to the first security identity provider associated with the target Push source (see [Creating a Security Identity Provider for a Secured Push Source](https://docs.coveo.com/en/85/).  \n**Example:** `My Secured Push Source Security Identity Provider`"
        type: string
    type: object
  PermissionSetsModel:
    properties:
      allowAnonymous:
        description: Whether this permission set allows anonymous users to see the item in their query results.
        type: boolean
      allowedPermissions:
        items:
          $ref: '#/definitions/PermissionIdentityModel'
          description: "The security identities that are explicitly allowed to see the item by this permission set.  \n**Note:**  \n> You must push those security identities in the security identity provider of the target Push source, otherwise they will be in error (see [Manage security identities in a security identity provider](https://docs.coveo.com/en/132/))."
        type: array
      deniedPermissions:
        items:
          $ref: '#/definitions/PermissionIdentityModel'
          description: "The security identities that are explicitly denied to see the item by this permission set.  \n**Note:**  \n> You must push those security identities in the security identity provider of the target Push source, otherwise they will be in error (see [Manage security identities in a security identity provider](https://docs.coveo.com/en/132/))."
        type: array
    type: object
  Error:
    properties:
      errorCode:
        type: string
      message:
        type: string
    type: object
  DocumentBody:
    additionalProperties:
      description: "The metadata key-value pairs to push along with the item (see [Push source item metadata](https://docs.coveo.com/en/115/)).  \n**Note:**  \nThis specification indicates that metadata values must be of the string type, but other types of metadata values are also actually supported (see [Allowed metadata types](https://docs.coveo.com/en/162/))."
      type: string
    properties:
      compressedBinaryData:
        description: "The Base64-encoded item data.  \nDepending on your specific needs, you can either use the `data`, `compressedBinaryData`, or `compressedBinaryDataFileId` property to push item data (see [Push source item data](https://docs.coveo.com/en/73/)).  \n**Example:** `\"H4sIAAAAAAAA/0utSMwtyEkFAJ+b7G4HAAAA\"`"
        type: string
      compressedBinaryDataFileId:
        description: "The unique identifier of the file container where the compressed or uncompressed, binary or non-binary item data was previously uploaded (see [Create a file container](https://docs.coveo.com/en/43/)).  \nDepending on your specific needs, you can either use the `data`, `compressedBinaryData`, or `compressedBinaryDataFileId` property to push item data (see [Push source item data](https://docs.coveo.com/en/73/)).  \n**Example:** `\"b5e8767e-8f0d-4a89-9095-1127915c89c7\"`"
        type: string
      data:
        description: "The raw textual item data.  \nDepending on your specific needs, you can either use the `data`, `compressedBinaryData`, or `compressedBinaryDataFileId` property to push item data (see [Push source item data](https://docs.coveo.com/en/73/)).  \n**Example:** `\"<div>My raw textual item data</div>\"`"
        type: string
      fileExtension:
        description: "The file extension of the item data you are pushing.  \nValue must include a preceding `.` character.  \nSpecifying a value for this property is typically only useful when using the `compressedBinaryData` or `compressedBinaryDataFileId` property to push compressed item data.  \n**Example:** `\".html\"`"
        type: string
      parentId:
        description: "The URI of the parent item (see [Understanding the parentId Property](https://docs.coveo.com/en/57/)).  \n**Example:** `\"file://folder/\"`"
        type: string
      permissions:
        items:
          $ref: '#/definitions/PermissionSetsModel'
          description: "The permission sets for this item.  \nThis is only useful when pushing items in a secured Push source.  \nA security identity must be explicitly allowed in **all** permission sets, and not be explicitly denied in **any** permission set to be allowed to see the item.  \n**Note:**  \n> The permission model described in this specification is flexible enough to allow you to faithfully replicate most secured enterprise systems (see [Simplified permission model](https://docs.coveo.com/en/107/)). However, the Push API also accepts a more complex permission model which allows you to define multiple permission levels and sets (see [Complete permission model](https://docs.coveo.com/en/25/))."
        type: array
    type: object
