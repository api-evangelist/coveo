        in: path
        name: sourceId
        required: true
        type: string
      - description: "The unique identifier of the item. The Coveo item URI (see [Request parameters](https://docs.coveo.com/en/78/#query-parameters-add-update)).  \n**Example:** `file://folder/my-file.html`"
        in: query
        name: documentId
        required: true
        type: string
      - description: "The unique identifier of the target Coveo Cloud V2 organization.  \n**Example:** `mycoveocloudv2organizationg8tp8wu3`"
        in: path
        name: organizationId
        required: true
        type: string
      - description: "The algorithm that was used to compress the item data.  \nSpecifying a value for this parameter is only necessary when using the `compressedBinaryData` or the `compressedBinaryDataFileId` property to push item data (see [Push source item data](https://docs.coveo.com/en/73/)).  \nThe possible values are: `Uncompressed`, `ZLib`, `GZip`, `LZMA`, and `Deflate`.  \n**Example:** `ZLib`"
        enum:
        - UNCOMPRESSED
        - ZLIB
        - GZIP
        - LZMA
        - DEFLATE
        in: query
        name: compressionType
        required: false
        type: string
      - description: A JSON describing a single item to add or update in a Push source.
        in: body
        name: documentBody
        required: true
        schema:
          $ref: '#/definitions/DocumentBody'
