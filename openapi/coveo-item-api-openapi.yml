tags:
- description: Manage items in a Push source
  name: Item
paths:
  /organizations/{organizationId}/sources/{sourceId}/documents:
    delete:
      description: Deletes a specific item from a Push source. Optionally, the items of that item can also be deleted.
      externalDocs:
        description: Delete an item and optionally, its children in a Push source
        url: https://docs.coveo.com/en/171/
      parameters:
      - description: "A value indicating the order of arrival of the Push operation in the Coveo Cloud V2 indexing pipeline. A lower value corresponds to an older operation.  \nBy default, the service automatically sets this parameter to the current number of milliseconds since Unix Epoch.  \nSpecifying a custom `orderingId` value is typically not recommended unless you know what you are doing and have a good reason to do so (see [About the orderingId parameter](https://docs.coveo.com/en/147/)).  \n**Example:**  `1506700606240`"
        format: int64
        in: query
        name: orderingId
        required: false
        type: integer
      - default: false
        description: Whether to also delete the children of the item.
        in: query
        name: deleteChildren
        required: false
        type: boolean
      - description: "The unique identifier of the target Push source (see [Creating a Push Source](https://developers.coveo.com/x/34s9Ag)).  \n**Example:** `rp5rxzbdz753uhndklv2ztkfgy-mycoveocloudv2organizationg8tp8wu3`"
        in: path
        name: sourceId
        required: true
        type: string
      - description: "The unique identifier of the item. The Coveo item URI (see [Request parameters](https://docs.coveo.com/en/78/#query-parameters-add-update)).  \n**Example:** `file://folder/my-file.html`"
        in: query
        name: documentId
        required: true
        type: string
      - description: "The unique identifier of the target Coveo Cloud V2 organization.  \n**Example:** `mycoveocloudv2organizationg8tp8wu3`"
        in: path
        name: organizationId
        required: true
        type: string
