        required: false
        schema:
          type: boolean
          default: false
      - name: cloudCrazeOrdersIndexed
        in: query
        required: false
        schema:
          type: boolean
          default: false
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/SalesforceObject'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SalesforceObject'
      x-pretty-name: refreshSchema
      x-ui-operation-id: /rest/sourceconfiguration/salesforce/schema_post
  /rest/sourceconfiguration/salesforce/parseOTG:
    post:
      tags:
      - Salesforce Source Configuration
      summary: Parse an ObjectsToGet to a Schema
      operationId: parseOTG
      parameters:
      - name: schemaVersion
