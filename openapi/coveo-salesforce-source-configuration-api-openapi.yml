        in: query
        required: false
        schema:
          type: boolean
          default: false
      - name: cloudCrazeProductsIndexed
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - name: cloudCrazeOrdersIndexed
        in: query
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SalesforceObject'
      x-pretty-name: getSchema
      x-ui-operation-id: /rest/sourceconfiguration/salesforce/schema_get
    post:
      tags:
      - Salesforce Source Configuration
      summary: Refresh Complete Schema (objects and Fields)
      operationId: refreshSchema
      parameters:
