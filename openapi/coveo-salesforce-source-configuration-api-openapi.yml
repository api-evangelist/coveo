components:
  schemas:
    SalesforceObject:
      type: object
      properties:
        type:
          type: string
          enum:
          - SERVICE_CLOUD
          - CHATTER
          - CONTENT
          - KNOWLEDGEBASE
          - CUSTOM
        name:
          type: string
        label:
          type: string
        indexed:
          type: boolean
        filesIndexed:
          type: boolean
        canHaveFiles:
          type: boolean
        custom:
          type: boolean
        hasCustomFiletype:
          type: boolean
        fields:
          type: array
          items:
            $ref: '#/components/schemas/SalesforceField'
        relationships:
          type: array
          items:
            $ref: '#/components/schemas/SalesforceRelationship'
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/SalesforceCondition'
        searchable:
          type: boolean
        categories:
          type: array
          items:
            type: string
            enum:
            - SERVICE_CLOUD
            - EXPERIENCE_CLOUD
            - KNOWLEDGE
            - CUSTOM_OBJECT
            - STANDARD
            - CHATTER
    MappingModel:
      type: object
      properties:
        id:
          type: string
        kind:
          type: string
          deprecated: true
          enum:
          - COMMON
          - MAPPING
        type:
          type: string
        fieldName:
          type: string
        extractionMethod:
          type: string
        content:
          type: string
          deprecated: true
        rules:
          type: array
          items:
            type: string
        fieldTypeHint:
          type: string
          enum:
          - LONG
          - LONG_64
          - DOUBLE
          - DATE
          - STRING
          - VECTOR
    SalesforceField:
      type: object
      properties:
        name:
          type: string
        label:
          type: string
        nestedLabel:
          type: string
        type:
          type: string
        indexed:
          type: boolean
        mandatory:
          type: boolean
        custom:
          type: boolean
        mappings:
          uniqueItems: true
          type: array
          items:
            $ref: '#/components/schemas/MappingModel'
        values:
          type: array
          items:
            type: string
        referenceTypes:
          type: array
          items:
            type: string
        relationshipName:
          type: string
        relationshipNameField:
          type: string
        relationshipParent:
          type: boolean
        relationshipPolymorphic:
          type: boolean
    SalesforceCondition:
      type: object
      properties:
        fieldName:
          type: string
        operator:
          type: string
          enum:
          - EQUALS
          - NOT_EQUALS
          - LESS_THAN
          - LESS_OR_EQUAL_THAN
          - GREATER_THAN
          - GREATER_OR_EQUAL_THAN
          - LIKE
          - NOT_LIKE
          - INCLUDES
          - EXCLUDES
          - IN
          - NOT_IN
        value:
          type: string
        inConditionValues:
          type: array
          items:
            $ref: '#/components/schemas/SalesforceInConditionValue'
    SalesforceInConditionValue:
      type: object
      properties:
        type:
          type: string
          enum:
          - SOQL_STRING
          - SOQL_ID
          - SOQL_DATETIME
          - SOQL_BOOLEAN
          - SOQL_OTHER
        value:
          type: string
    SalesforceRelationship:
      type: object
      properties:
        relationshipName:
          type: string
        relationshipType:
          type: string
          enum:
          - NON_POLYMORPHIC_PARENT
          - POLYMORPHIC_PARENT
          - CHILD
        referenceField:
          type: string
        referencesTo:
          type: array
          items:
            type: string
        fields:
          type: array
          items:
            $ref: '#/components/schemas/SalesforceField'
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/SalesforceCondition'
        createRecord:
          type: boolean
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://platform.cloud.coveo.com/oauth/authorize
          tokenUrl: https://platform.cloud.coveo.com/oauth/token
          scopes:
            full: required
