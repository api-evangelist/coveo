          default: ''
      - name: idUrl
        in: query
        required: false
        schema:
          type: string
          default: ''
      - name: refreshToken
        in: query
        required: false
        schema:
          type: string
          default: ''
      - name: refreshTokenGuid
        in: query
        required: false
        schema:
          type: string
          default: ''
      - name: schemaVersion
        in: query
        required: false
        schema:
          type: string
          default: EXPRESS
          enum:
          - CLOUDV1
          - LEGACY
          - EXPRESS
      - name: sandbox
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - name: serviceCloudIndexed
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - name: knowledgeIndexed
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - name: contentIndexed
        in: query
