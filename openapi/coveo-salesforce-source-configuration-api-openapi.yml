        schema:
          type: boolean
          default: false
      - name: serviceCloudIndexed
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - name: knowledgeIndexed
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - name: contentIndexed
        in: query
