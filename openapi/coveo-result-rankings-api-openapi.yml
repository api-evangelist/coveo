          type: string
        key:
          type: string
        keys:
          type: array
          items:
            type: string
    ResultRankingRuleFeaturedResultsListResponse:
      allOf:
      - $ref: '#/components/schemas/ResultRankingRuleListResponseBase'
      - $ref: '#/components/schemas/ResultRankingRuleFeaturedResultsBase'
    ResultRankingRuleFeaturedResultsResponse:
