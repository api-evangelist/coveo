                  example: <svg><circle/></svg>
            buttonJS:
              description: The button's JavaScript.
              type: array
              items:
                $ref: '#/components/schemas/swaggermodels.buttonJavaScriptResponseModel'
            buttonPosition:
              description: The button's text alignment.
              type: object
              properties:
                horizontalPosition:
                  description: The horizontal alignment of the button.
                  type: string
                  default: Right
                  enum:
                  - Undefined
                  - Left
                  - Center
                  - Right
                  example: Center
                verticalPosition:
