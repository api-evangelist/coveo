          type: string
    swaggermodels.ResponseApplicationErrorForbidden:
      type: object
      properties:
        errorCode:
          type: integer
          example: 403
        message:
          type: string
    swaggermodels.buttonJavaScriptResponseModel:
      type: object
      properties:
        inlineContent:
          description: The content of the header "script" tag.
