        queryPipeline:
          description: The name of the [query pipeline](https://docs.coveo.com/en/180/) to enforce when executing search requests with the token.
          type: string
          example: InternalSearch
        searchHub:
          description: The name of the [search hub](https://docs.coveo.com/en/1342/) / [origin level 1](https://docs.coveo.com/en/1337/) to pass when executing search requests and logging usage analytics events with the token.
          type: string
