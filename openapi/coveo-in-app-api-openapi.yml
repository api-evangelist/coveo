  /rest/organizations/{organizationID}/pages/{pageID}/inappwidget/loader:
    get:
      security:
      - OAuth2:
        - full
      description: Retrieves the JavaScript code that can initialize a specific InAppWidget configured in a [Coveo Cloud organization](https://docs.coveo.com/en/185). <br/><br/>**Required privilege:** None<br/>
      tags:
      - In-App
      summary: Get InAppWidget Loader
      parameters:
      - description: The unique identifier of the target Coveo Cloud [organization](https://docs.coveo.com/en/185) whose InAppWidget loader should be retrieved (e.g., 'mycoveocloudv2organizationg8tp8wu3').
        name: organizationID
        in: path
        required: true
        schema:
          type: string
      - description: The unique identifier of the search page whose corresponding InAppWidget loader should be retrieved (e.g., '12b627f9-e3aa-49db-a0f5-5c0c1392e59e').
        name: pageID
        in: path
        required: true
        schema:
          type: string
      - description: <p>An access token (e.g., [search token](https://docs.coveo.com/en/1346/) or API key) the loader should initialize the InAppWidget with.</p><p>If provided, this token:</p><ul><li>Must grant the **Allowed** [access level](https://docs.coveo.com/en/2818/) on the **Execute Queries** [domain](https://docs.coveo.com/en/2819/), and the **Push** access level on the **Analytics Data** domain in the target [organization](https://docs.coveo.com/en/185/).</li><li>Will completely override the search token configuration specified the InAppWidget.</li></ul>
        name: access_token
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/javascript:
              schema:
                type: string
        '400':
          description: Bad Request
          content:
            text/javascript:
              schema:
                $ref: '#/components/schemas/swaggermodels.ResponseApplicationErrorBadRequest'
        '403':
          description: Forbidden
          content:
            text/javascript:
              schema:
                $ref: '#/components/schemas/swaggermodels.ResponseApplicationErrorForbidden'
        '404':
          description: Not Found
          content:
            text/javascript:
              schema:
                $ref: '#/components/schemas/swaggermodels.ResponseApplicationErrorNotFound'
        '500':
          description: Internal Server Error
          content:
            text/javascript:
              schema:
                $ref: '#/components/schemas/swaggermodels.ResponseApplicationErrorInternalServerError'
components:
  schemas:
